<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6B1C3F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mikit Terrains">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Mikit — Analyse Parcelle & Risques</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Firebase SDK (désactivé pour la phase de test)
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    -->
    <style>
        :root {
            --primary: #6B1C3F;
            --primary-light: #8a2854;
            --primary-dark: #4a0e2a;
            --accent: #F39C12;
            --accent-dark: #E67E22;
            --rose: #CE007C;
            --bg: #faf8f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e8e0e4;
            --risk-low: #22c55e;
            --risk-medium: #f59e0b;
            --risk-high: #ef4444;
            --risk-unknown: #94a3b8;
            --risk-existant: #3b82f6;
            --risk-none: #22c55e;
            --shadow: 0 1px 3px rgba(107,28,63,0.08), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px rgba(107,28,63,0.1), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 15px rgba(107,28,63,0.12), 0 4px 6px rgba(0,0,0,0.05);
            --radius: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* HEADER */
        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white; padding: 14px 24px; display: flex; align-items: center; gap: 16px;
            box-shadow: var(--shadow-md); position: relative; z-index: 2000;
        }
        .logo { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
        .logo .m { color: var(--accent); }
        .logo .sub { font-size: 15px; font-weight: 400; opacity: 0.9; margin-left: 8px; letter-spacing: 0; }
        header .subtitle { font-size: 13px; opacity: 0.8; }

        /* SEARCH */
        .search-section {
            background: var(--card-bg); padding: 16px 24px;
            border-bottom: 2px solid var(--accent); box-shadow: var(--shadow);
            position: relative; z-index: 1500;
        }
        .search-container { max-width: 960px; margin: 0 auto; display: flex; gap: 12px; flex-wrap: wrap; }
        .search-mode-toggle { display: flex; gap: 2px; background: #f3eef0; padding: 2px; border-radius: 6px; margin-bottom: 0; }
        .search-mode-btn { padding: 7px 14px; border: none; background: transparent; font-size: 12px; font-weight: 600; color: var(--text-light); cursor: pointer; border-radius: 5px; white-space: nowrap; }
        .search-mode-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: var(--shadow); }
        .btn-geo { padding: 10px 14px; background: var(--rose); color: white; border: none; border-radius: var(--radius); font-size: 14px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
        .btn-geo:hover { background: #a30063; }
        .parcelle-fields { display: flex; gap: 8px; flex: 1; }
        .parcelle-fields input { padding: 12px 12px; border: 2px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; }
        .parcelle-fields input:focus { border-color: var(--rose); }
        .parcelle-fields .f-commune { flex: 2; }
        .parcelle-fields .f-section { width: 90px; }
        .parcelle-fields .f-numero { width: 100px; }
        .search-input-wrapper { flex: 1; position: relative; }
        .search-input-wrapper input {
            width: 100%; padding: 12px 16px 12px 42px; border: 2px solid var(--border);
            border-radius: var(--radius); font-size: 15px; outline: none; transition: border-color 0.2s;
        }
        .search-input-wrapper input:focus { border-color: var(--rose); }
        .search-input-wrapper .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 18px; }
        .suggestions-list {
            position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg);
            border: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius);
            box-shadow: var(--shadow-lg); z-index: 9000; max-height: 250px; overflow-y: auto; display: none;
        }
        .suggestions-list.visible { display: block; }
        .suggestion-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
        .suggestion-item:hover { background: #fdf2f8; }
        .suggestion-item .label { font-weight: 500; }
        .suggestion-item .context { color: var(--text-light); font-size: 13px; }
        .btn-search {
            padding: 12px 28px; background: var(--accent); color: white; border: none;
            border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap;
            text-shadow: 0 1px 1px rgba(0,0,0,0.15);
        }
        .btn-search:hover { background: var(--accent-dark); }

        /* SUMMARY BAR */
        .summary-bar {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white; padding: 10px 20px; display: none; align-items: center; gap: 20px; font-size: 13px; flex-wrap: wrap;
        }
        .summary-bar.visible { display: flex; }
        .summary-bar .summary-item { display: flex; align-items: center; gap: 6px; }
        .summary-bar .val { font-weight: 700; font-size: 14px; color: var(--accent); }

        /* MAIN LAYOUT */
        .main-content { display: grid; grid-template-columns: 460px 1fr; height: calc(100vh - 120px); }
        @media (max-width: 1024px) { .main-content { grid-template-columns: 1fr; height: auto; } }

        /* PANEL */
        .panel { overflow-y: auto; padding: 16px; border-right: 1px solid var(--border); }
        .panel-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-light); text-align: center; padding: 40px; }
        .panel-placeholder .icon { font-size: 48px; margin-bottom: 16px; }

        /* TABS */
        .tabs { display: flex; gap: 3px; background: #f3eef0; padding: 3px; border-radius: var(--radius); margin-bottom: 14px; }
        .tab {
            flex: 1; padding: 9px 6px; border: none; background: transparent; font-size: 12px;
            font-weight: 600; color: var(--text-light); cursor: pointer; border-radius: 7px; text-align: center;
        }
        .tab.active { background: var(--card-bg); color: var(--primary); box-shadow: var(--shadow); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* CARDS */
        .info-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
        .info-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--primary); }
        .info-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; border-bottom: 1px solid #f5f0f2; }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { color: var(--text-light); }
        .info-row .value { font-weight: 600; text-align: right; max-width: 60%; }

        /* RISK CARDS */
        .risk-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); border-left: 4px solid var(--risk-unknown); }
        .risk-card.faible { border-left-color: var(--risk-low); }
        .risk-card.modere, .risk-card.existant { border-left-color: var(--risk-existant); }
        .risk-card.important { border-left-color: var(--risk-high); }
        .risk-card.non_concerne { border-left-color: var(--risk-none); }
        .risk-card .risk-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .risk-card .risk-title { font-weight: 700; font-size: 13px; }
        .risk-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
        .risk-badge.faible { background: #dcfce7; color: #166534; }
        .risk-badge.modere { background: #dbeafe; color: #1e40af; }
        .risk-badge.existant { background: #dbeafe; color: #1e40af; }
        .risk-badge.important { background: #fee2e2; color: #991b1b; }
        .risk-badge.non_concerne { background: #f0fdf4; color: #166534; }
        .risk-badge.inconnu { background: #f1f5f9; color: #475569; }
        .risk-card .risk-detail { font-size: 13px; color: var(--text-light); line-height: 1.5; }
        .risk-card .risk-sub { font-size: 12px; color: var(--text-light); margin-top: 4px; font-style: italic; }

        /* PLU */
        .plu-zone-badge { display: inline-block; padding: 6px 16px; border-radius: 6px; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
        .plu-zone-badge.U { background: #fee2e2; color: #991b1b; }
        .plu-zone-badge.AU { background: #fef3c7; color: #92400e; }
        .plu-zone-badge.A { background: #dcfce7; color: #166534; }
        .plu-zone-badge.N { background: #dbeafe; color: #1e40af; }
        .plu-info { font-size: 13px; color: var(--text-light); line-height: 1.6; }

        .link-btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
            background: var(--primary); color: white; text-decoration: none; border-radius: 6px;
            font-size: 13px; font-weight: 600; margin-top: 8px; transition: background 0.2s;
        }
        .link-btn:hover { background: var(--primary-light); }
        .link-btn.secondary { background: #475569; }
        .link-btn.secondary:hover { background: #64748b; }
        .link-btn.accent { background: var(--accent); }
        .link-btn.accent:hover { background: var(--accent-dark); }
        .link-btn.rose { background: var(--rose); }
        .link-btn.rose:hover { background: #a30063; }

        /* MAP */
        .map-container { position: relative; }
        #map { width: 100%; height: 100%; min-height: 500px; cursor: crosshair; }
        .map-click-hint {
            position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(107,28,63,0.92); color: white; padding: 8px 18px;
            border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 900;
            box-shadow: var(--shadow-lg); pointer-events: none; white-space: nowrap;
            display: none; animation: fadeInHint 0.3s ease;
        }
        .map-click-hint.visible { display: block; }
        @keyframes fadeInHint { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .parcel-selected-popup { font-size: 13px; line-height: 1.5; }
        .parcel-selected-popup strong { color: var(--primary); }
        .parcel-selected-popup .btn-select-parcel {
            display: block; margin-top: 8px; padding: 6px 14px; background: var(--accent); color: white;
            border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
        }
        .parcel-selected-popup .btn-select-parcel:hover { background: var(--accent-dark); }
        .map-layers-panel {
            position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.97);
            padding: 12px 16px; border-radius: var(--radius); box-shadow: var(--shadow-lg);
            z-index: 800; font-size: 13px; max-width: 250px;
        }
        .map-layers-panel h4 { font-size: 13px; margin-bottom: 8px; font-weight: 700; color: var(--primary); }
        .layer-toggle { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; cursor: pointer; }
        .layer-toggle input { cursor: pointer; margin-top: 2px; accent-color: var(--primary); }
        .layer-name { font-weight: 600; font-size: 12px; }
        .layer-desc { font-size: 11px; color: var(--text-light); line-height: 1.3; margin-top: 1px; }

        /* STATUS */
        .status-msg { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 10px; }
        .status-msg.error { background: #fee2e2; color: #991b1b; }
        .status-msg.warning { background: #fef3c7; color: #92400e; }
        .status-msg.info { background: #fdf2f8; color: var(--primary); }
        .status-msg.success { background: #dcfce7; color: #166534; }

        /* LOADING */
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.88); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; gap: 16px; }
        .loading-overlay.visible { display: flex; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 15px; color: var(--text-light); font-weight: 500; }

        .rapport-banner {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; padding: 12px 14px;
            border-radius: var(--radius); margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
        }
        .rapport-banner .icon { font-size: 24px; }
        .rapport-banner .text { flex: 1; }
        .rapport-banner .text strong { font-size: 13px; display: block; margin-bottom: 2px; }
        .rapport-banner .text span { font-size: 12px; opacity: 0.9; }
        .rapport-banner a { background: var(--accent); color: white; padding: 7px 14px; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 12px; white-space: nowrap; }

        /* PLU ANALYSIS FORM */
        .plu-analysis-form {
            display: none;
        }
        .plu-analysis-form.active {
            display: block;
        }
        .form-section {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow);
        }
        .form-section h4 {
            font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 12px;
            padding-bottom: 8px; border-bottom: 2px solid var(--accent);
        }
        .form-group {
            margin-bottom: 12px; display: flex; flex-direction: column;
        }
        .form-group label {
            font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px;
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea,
        .form-group select {
            padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
            font-size: 13px; font-family: inherit; background: var(--card-bg); color: var(--text);
            outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--rose);
        }
        .form-group textarea {
            resize: vertical; min-height: 80px;
        }
        .form-group.grid-2 {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .form-group.grid-2 > * {
            margin-bottom: 0;
        }
        .upload-zones {
            display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;
        }
        .upload-zone {
            border: 2px dashed var(--border); border-radius: 8px; padding: 16px;
            text-align: center; cursor: pointer; transition: all 0.2s;
            background: #faf8f9;
        }
        .upload-zone:hover {
            border-color: var(--rose); background: #fdf2f8;
        }
        .upload-zone.dragover {
            border-color: var(--accent); background: #fef7e8;
        }
        .upload-zone-title {
            font-weight: 600; font-size: 13px; color: var(--primary); margin-bottom: 4px;
        }
        .upload-zone .file-loaded {
            color: var(--primary); font-weight: 600; font-size: 13px;
        }
        .btn-launch-analysis {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700;
            cursor: pointer; margin: 16px 0; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: opacity 0.2s; letter-spacing: 0.3px;
        }
        .btn-launch-analysis:hover { opacity: 0.9; }
        .btn-launch-analysis:disabled { opacity: 0.5; cursor: not-allowed; }
        .analysis-progress {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 14px; margin-bottom: 12px; display: none;
        }
        .analysis-progress.visible { display: block; }
        .analysis-progress .progress-bar-bg {
            background: #f3eef0; border-radius: 6px; height: 8px; overflow: hidden; margin: 8px 0;
        }
        .analysis-progress .progress-bar-fill {
            background: linear-gradient(90deg, var(--primary), var(--accent)); height: 100%;
            border-radius: 6px; transition: width 0.4s ease; width: 0%;
        }
        .analysis-progress .progress-text { font-size: 12px; color: var(--text-light); }
        .extracted-text-panel {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
            margin-bottom: 12px; max-height: 300px; overflow: hidden; display: none;
        }
        .extracted-text-panel.visible { display: block; }
        .extracted-text-panel .panel-header {
            display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
            border-bottom: 1px solid var(--border); cursor: pointer;
        }
        .extracted-text-panel .panel-header h4 { font-size: 13px; font-weight: 700; color: var(--primary); margin: 0; }
        .extracted-text-panel .panel-body {
            padding: 10px 14px; max-height: 240px; overflow-y: auto; font-size: 12px;
            line-height: 1.6; color: var(--text); white-space: pre-wrap; font-family: inherit;
        }
        .extracted-text-panel .panel-body mark {
            background: #fef3c7; color: #92400e; padding: 1px 3px; border-radius: 2px;
        }
        .extracted-text-panel .search-bar {
            display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--border);
        }
        .extracted-text-panel .search-bar input {
            flex: 1; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px;
            font-size: 12px; outline: none;
        }
        .extracted-text-panel .search-bar input:focus { border-color: var(--rose); }
        .extracted-text-panel .search-bar button {
            padding: 6px 12px; background: var(--primary); color: white; border: none;
            border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;
        }
        .form-group input.auto-filled,
        .form-group textarea.auto-filled,
        .form-group select.auto-filled {
            border-color: var(--accent); background: #fffbf0;
        }
        .auto-badge {
            display: inline-block; font-size: 10px; background: var(--accent); color: white;
            padding: 1px 6px; border-radius: 10px; margin-left: 6px; font-weight: 700; vertical-align: middle;
        }
        .upload-zone-hint {
            font-size: 12px; color: var(--text-light);
        }
        .upload-zone .auto-detected {
            display: inline-block; background: #dcfce7; color: #166534; padding: 2px 8px;
            border-radius: 4px; font-size: 11px; font-weight: 600; margin-top: 4px;
        }
        .pdf-viewer {
            width: 100%; height: 400px; border: 1px solid var(--border); border-radius: 6px;
            margin-bottom: 12px; display: none;
        }
        .pdf-viewer.active {
            display: block;
        }
        .btn-generate {
            width: 100%; padding: 12px; background: var(--accent); color: white;
            border: none; border-radius: var(--radius); font-size: 14px; font-weight: 700;
            cursor: pointer; margin-top: 16px;
        }
        .btn-generate:hover {
            background: var(--accent-dark);
        }

        @media print {
            header, .search-section, .map-container, .map-layers-panel { display: none; }
            .main-content { grid-template-columns: 1fr; }
            .panel { border: none; overflow: visible; height: auto; }
            .tab-content { display: block !important; }
            .tabs { display: none; }
        }
        /* LOGIN OVERLAY */
        /* LOGIN (désactivé pour la phase de test — conservé pour activation future) */
    </style>
</head>
<body>

<header>
    <div>
        <div class="logo"><span class="m">M</span>IKIT<span class="sub">Terrains</span></div>
        <div class="subtitle">Analyse parcellaire — Risques, Urbanisme & Marché</div>
    </div>
</header>

<div class="search-section">
    <div class="search-container">
        <div class="search-mode-toggle">
            <button class="search-mode-btn active" onclick="setSearchMode('adresse')">&#128205; Adresse</button>
            <button class="search-mode-btn" onclick="setSearchMode('parcelle')">&#128203; Parcelle</button>
        </div>

        <div id="searchAdresse" style="display:flex;gap:12px;flex:1;align-items:center;">
            <div class="search-input-wrapper" style="flex:1;">
                <span class="search-icon">&#128269;</span>
                <input type="text" id="addressInput" placeholder="Saisissez une adresse (ex : 1 rue de l'union, 92500 Rueil-Malmaison)" autocomplete="off" />
                <div class="suggestions-list" id="suggestions"></div>
            </div>
        </div>

        <div id="searchParcelle" style="display:none;flex:1;">
            <div class="parcelle-fields">
                <input type="text" class="f-commune" id="parcelleCommune" placeholder="Commune (ex : Rueil-Malmaison)" />
                <input type="text" class="f-section" id="parcelleSection" placeholder="Section" />
                <input type="text" class="f-numero" id="parcelleNumero" placeholder="N° parc." />
            </div>
        </div>

        <button class="btn-geo" onclick="geolocate()" title="Me localiser">&#128205;</button>
        <button class="btn-search" onclick="launchAnalysis()">Analyser</button>
    </div>
</div>

<div class="summary-bar" id="summaryBar">
    <div class="summary-item">&#128205; <span id="summaryAddress" class="val"></span></div>
    <div class="summary-item">Parcelle : <span id="summaryParcelle" class="val">—</span></div>
    <div class="summary-item">Zone : <span id="summaryPLU" class="val">—</span></div>
</div>

<div class="main-content">
    <div class="panel" id="panel">
        <div class="panel-placeholder" id="placeholder">
            <div class="icon">&#127968;</div>
            <p><strong>Recherchez une adresse</strong><br>pour afficher l'analyse parcellaire, les risques, le PLU et le marché immobilier.</p>
        </div>
        <div id="results" style="display:none;">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('parcelle')">&#128203; Parcelle</button>
                <button class="tab" onclick="switchTab('risques')">&#9888;&#65039; Risques</button>
                <button class="tab" onclick="switchTab('plu')">&#127959;&#65039; PLU</button>
                <button class="tab" onclick="switchTab('marche')">&#128176; Marché</button>
                <button class="tab" onclick="switchTab('raccourcis')">&#128279; Raccourcis</button>
                <button class="tab" onclick="switchTab('analyse')">&#128210; Analyse</button>
            </div>
            <div class="tab-content active" id="tab-parcelle"></div>
            <div class="tab-content" id="tab-risques"></div>
            <div class="tab-content" id="tab-plu"></div>
            <div class="tab-content" id="tab-marche"></div>
            <div class="tab-content" id="tab-raccourcis"></div>
            <div class="tab-content" id="tab-analyse"></div>
        </div>
    </div>

    <div class="map-container">
        <div id="map"></div>
        <div class="map-click-hint" id="mapClickHint">&#128073; Cliquez sur une parcelle pour la sélectionner</div>
        <div class="map-layers-panel" id="layersPanel" style="display:none;">
            <h4>&#128506; Couches</h4>
            <label class="layer-toggle">
                <input type="checkbox" id="toggleCadastre" checked onchange="toggleLayer('cadastre')">
                <div><div class="layer-name">Cadastre</div><div class="layer-desc">Parcelles cadastrales</div></div>
            </label>
            <label class="layer-toggle" style="opacity:0.5;">
                <input type="checkbox" id="toggleZonage" disabled>
                <div><div class="layer-name">Zonage PLU</div><div class="layer-desc">Indisponible (service WMS supprimé)</div></div>
            </label>
        </div>
    </div>
</div>

<div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Analyse en cours...</div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const API = {
    BAN: 'https://api-adresse.data.gouv.fr',
    CADASTRE: 'https://apicarto.ign.fr/api/cadastre/parcelle',
    GPU: 'https://apicarto.ign.fr/api/gpu',
    GPU_DOCS: 'https://www.geoportail-urbanisme.gouv.fr/api/document',
    GR: 'https://georisques.gouv.fr/api/v1',
    WMS_CADASTRE: 'https://data.geopf.fr/wms-r/wms',
    WMS_GPU: 'https://data.geopf.fr/wms-v/ows',  // ZONE_URBA supprimé de ce service — couche désactivée
    BRGM: 'https://geoservices.brgm.fr/risques',
};

function escapeHtml(str) {
    if (!str) return '';
    const m = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(str).replace(/[&<>"']/g, c => m[c]);
}

// ============================================================
// MAP
// ============================================================
const map = L.map('map', { zoomControl: true }).setView([46.6, 2.5], 6);
L.tileLayer(
    'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png',
    { maxZoom: 20, attribution: '&copy; IGN' }
).addTo(map);

let cadastreLayer = L.tileLayer.wms(API.WMS_CADASTRE, {
    layers: 'CADASTRALPARCELS.PARCELLAIRE_EXPRESS',
    transparent: true, format: 'image/png', opacity: 0.6,
    version: '1.3.0', crs: L.CRS.EPSG3857
}).addTo(map);

// Note: la couche ZONE_URBA n'est plus disponible sur data.geopf.fr (supprimée du service WMS).
// Le Géoportail de l'Urbanisme bloque les requêtes CORS. Pas d'alternative WMS accessible.
let zonageLayer = null;

let parcelGeoJSON = null;
let marker = null;
let clickedParcelLayer = null;
let mapClickEnabled = false;

// ============================================================
// MAP CLICK: Select a parcel by clicking on the map
// ============================================================
map.on('click', async function(e) {
    if (map.getZoom() < 15) return; // Only allow parcel click when zoomed in enough
    const { lat, lng: lon } = e.latlng;

    // Query cadastre API for the parcel at this location
    const geomPoint = JSON.stringify({ type: 'Point', coordinates: [lon, lat] });
    try {
        const data = await safeFetch(`${API.CADASTRE}?geom=${encodeURIComponent(geomPoint)}&_limit=1`, 'Cadastre click');
        if (!data?.features?.length) return;

        const feature = data.features[0];
        const p = feature.properties;

        // Remove previous clicked parcel highlight
        if (clickedParcelLayer) map.removeLayer(clickedParcelLayer);

        // Draw the clicked parcel with a distinct style
        clickedParcelLayer = L.geoJSON(data, {
            style: { color: '#F39C12', weight: 3, fillColor: '#F39C12', fillOpacity: 0.25, dashArray: '' }
        }).addTo(map);

        // Show popup with parcel info + confirm button
        const popupContent = `<div class="parcel-selected-popup">
            <strong>${escapeHtml(p.nom_com || p.commune || '')}</strong><br>
            Section <strong>${p.section || '—'}</strong> — N° <strong>${p.numero || '—'}</strong><br>
            Surface : <strong>${p.contenance ? p.contenance + ' m²' : '—'}</strong>
            <button class="btn-select-parcel" onclick="confirmParcelSelection(${lat}, ${lon}, '${p.code_insee || p.commune || ''}')">
                &#10003; Analyser cette parcelle
            </button>
        </div>`;

        L.popup({ maxWidth: 260 })
            .setLatLng(e.latlng)
            .setContent(popupContent)
            .openOn(map);

    } catch(err) {
        console.warn('Parcel click error:', err);
    }
});

// Show/hide the click hint based on zoom level
map.on('zoomend', function() {
    const hint = document.getElementById('mapClickHint');
    if (map.getZoom() >= 15 && document.getElementById('results').style.display !== 'none') {
        hint.classList.add('visible');
    } else {
        hint.classList.remove('visible');
    }
});

async function confirmParcelSelection(lat, lon) {
    map.closePopup();
    selectedCoords = { lon, lat };

    // Reverse geocode to get the address and INSEE code
    try {
        const r = await safeFetch(`${API.BAN}/reverse/?lon=${lon}&lat=${lat}`, 'Reverse');
        if (r?.features?.length) {
            const f = r.features[0];
            addressInput.value = f.properties.label || `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            selectedInsee = f.properties.citycode || '';
        } else {
            addressInput.value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            selectedInsee = '';
        }
    } catch(e) {
        addressInput.value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
    }

    // Launch full analysis on this parcel
    launchAnalysis();
}

function toggleLayer(name) {
    const layers = { cadastre: [cadastreLayer, 'toggleCadastre'] };
    if (zonageLayer) layers.zonage = [zonageLayer, 'toggleZonage'];
    const entry = layers[name];
    if (!entry) return;
    const [layer, id] = entry;
    document.getElementById(id).checked ? layer.addTo(map) : map.removeLayer(layer);
}

// ============================================================
// AUTOCOMPLETE
// ============================================================
let debounceTimer = null;
const addressInput = document.getElementById('addressInput');
const suggestionsEl = document.getElementById('suggestions');
let selectedCoords = null, selectedInsee = null;

addressInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const q = addressInput.value.trim();
    if (q.length < 4) { suggestionsEl.classList.remove('visible'); return; }
    debounceTimer = setTimeout(() => fetchSuggestions(q), 250);
});
addressInput.addEventListener('keydown', e => { if (e.key === 'Enter') { suggestionsEl.classList.remove('visible'); launchAnalysis(); } });
document.addEventListener('click', e => { if (!suggestionsEl.contains(e.target) && e.target !== addressInput) suggestionsEl.classList.remove('visible'); });

async function fetchSuggestions(q) {
    try {
        const r = await fetch(`${API.BAN}/search/?q=${encodeURIComponent(q)}&limit=5`);
        const d = await r.json();
        if (d.features?.length) {
            suggestionsEl.innerHTML = d.features.map(f => {
                const p = f.properties;
                return `<div class="suggestion-item" data-lon="${f.geometry.coordinates[0]}" data-lat="${f.geometry.coordinates[1]}" data-label="${escapeHtml(p.label)}" data-insee="${p.citycode||''}">
                    <div class="label">${escapeHtml(p.label)}</div>
                    <div class="context">${escapeHtml(p.context||'')}</div></div>`;
            }).join('');
            suggestionsEl.querySelectorAll('.suggestion-item').forEach(el => {
                el.addEventListener('click', () => {
                    addressInput.value = el.dataset.label;
                    selectedCoords = { lon: parseFloat(el.dataset.lon), lat: parseFloat(el.dataset.lat) };
                    selectedInsee = el.dataset.insee;
                    suggestionsEl.classList.remove('visible');
                    launchAnalysis();
                });
            });
            suggestionsEl.classList.add('visible');
        } else suggestionsEl.classList.remove('visible');
    } catch(e) { console.error('Suggestions:', e); }
}

// ============================================================
// FETCH HELPERS
// ============================================================
async function safeFetch(url, label) {
    try {
        const r = await fetch(url);
        if (!r.ok) { console.warn(`[${label}] HTTP ${r.status}`); return null; }
        return await r.json();
    } catch(e) { console.warn(`[${label}] Erreur:`, e); return null; }
}

async function fetchBRGM(lon, lat, layer, label) {
    try {
        const d = 0.0005;
        const bbox = `${lon-d},${lat-d},${lon+d},${lat+d}`;
        const url = `${API.BRGM}?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo`
            + `&LAYERS=${layer}&QUERY_LAYERS=${layer}`
            + `&BBOX=${bbox}&WIDTH=101&HEIGHT=101&X=50&Y=50`
            + `&SRS=EPSG:4326&INFO_FORMAT=application/json`;
        const r = await fetch(url);
        if (!r.ok) { console.warn(`[BRGM ${label}] HTTP ${r.status}`); return null; }
        const text = await r.text();
        try { return JSON.parse(text); }
        catch(e) { console.warn(`[BRGM ${label}] Non-JSON:`, text.substring(0, 200)); return null; }
    } catch(e) { console.warn(`[BRGM ${label}]`, e); return null; }
}

// ============================================================
// GPU: Fetch règlement écrit PDF URL (via feature-info for PLUi support)
// ============================================================
async function fetchReglementEcrit(lon, lat, insee) {
    try {
        // Step 1: Use feature-info/du to get correct partition (handles PLUi)
        let partition = `DU_${insee}`;
        try {
            const fiUrl = `https://www.geoportail-urbanisme.gouv.fr/api/feature-info/du?lon=${lon}&lat=${lat}&zoom=18`;
            const fiResp = await fetch(fiUrl);
            if (fiResp.ok) {
                const fiData = await fiResp.json();
                const features = fiData.features || fiData || [];
                const docFeature = features.find(f =>
                    f.id && (f.id.startsWith('document.') || f.id.startsWith('du_'))
                    || (f.properties && f.properties.partition)
                );
                if (docFeature && docFeature.properties && docFeature.properties.partition) {
                    partition = docFeature.properties.partition;
                    console.log('[GPU feature-info] Partition trouvée:', partition);
                } else {
                    // Try to find partition in any feature
                    for (const f of features) {
                        if (f.properties && f.properties.partition) {
                            partition = f.properties.partition;
                            console.log('[GPU feature-info] Partition (fallback):', partition);
                            break;
                        }
                    }
                }
            }
        } catch(e) {
            console.warn('[GPU feature-info] Erreur, fallback DU_' + insee, e);
        }

        // Step 2: Get documents for the partition
        const docs = await safeFetch(`${API.GPU_DOCS}?partition=${partition}&status=document.production`, 'GPU Docs');
        let docsList = docs;
        if (!docsList || !Array.isArray(docsList) || !docsList.length) {
            // Fallback: try without status filter
            docsList = await safeFetch(`${API.GPU_DOCS}?partition=${partition}`, 'GPU Docs fallback');
        }
        if (!docsList || !Array.isArray(docsList) || !docsList.length) {
            // Last fallback: try with DU_{insee} if partition was different
            if (partition !== `DU_${insee}`) {
                docsList = await safeFetch(`${API.GPU_DOCS}?partition=DU_${insee}`, 'GPU Docs INSEE fallback');
            }
        }
        if (!docsList || !Array.isArray(docsList) || !docsList.length) return null;

        // Find the active document
        let activeDoc = docsList.find(d => d.status === 'document.production');
        if (!activeDoc) {
            activeDoc = docsList.filter(d => d.publicationDate).sort((a, b) =>
                new Date(b.publicationDate.split('/').reverse().join('-')) - new Date(a.publicationDate.split('/').reverse().join('-'))
            )[0];
        }
        if (!activeDoc) activeDoc = docsList[0];
        if (!activeDoc) return null;

        // Step 3: Get files list for this document
        const files = await safeFetch(`${API.GPU_DOCS}/${activeDoc.id}/files`, 'GPU Files');
        if (!files || !Array.isArray(files) || !files.length) return null;

        // Find "Règlement écrit"
        const reglement = files.find(f =>
            (f.title && f.title.toLowerCase().includes('glement') && f.title.toLowerCase().includes('crit'))
            || (f.name && f.name.includes('_reglement_') && !f.name.includes('graphique'))
        );
        if (!reglement) return null;

        // Step 4: Build PDF URL using the correct partition
        const pdfUrl = `https://data.geopf.fr/annexes/gpu/documents/${partition}/${activeDoc.id}/${reglement.name}`;
        return { url: pdfUrl, name: reglement.name, title: reglement.title || 'Règlement écrit', docId: activeDoc.id, partition: partition };
    } catch(e) {
        console.warn('[GPU Règlement]', e);
        return null;
    }
}

// ============================================================
// FETCH: Commune data from geo.api.gouv.fr
// ============================================================
async function fetchCommuneData(insee) {
    try {
        const data = await safeFetch(`https://geo.api.gouv.fr/communes/${insee}?fields=nom,population,surface,codesPostaux,departement,region,siren,code`, 'Commune');
        return data;
    } catch(e) { console.warn('[Commune]', e); return null; }
}

// ============================================================
// FETCH: DVF Stats — dvf-api.data.gouv.fr
// ============================================================
async function fetchDVFStats(insee) {
    try {
        const data = await safeFetch(`https://dvf-api.data.gouv.fr/commune/${insee}`, 'DVF Stats');
        return data;
    } catch(e) { console.warn('[DVF Stats]', e); return null; }
}

// ============================================================
// SEARCH MODE: Adresse / Parcelle
// ============================================================
let searchMode = 'adresse';
function setSearchMode(mode) {
    searchMode = mode;
    document.querySelectorAll('.search-mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.search-mode-btn[onclick="setSearchMode('${mode}')"]`).classList.add('active');
    document.getElementById('searchAdresse').style.display = mode === 'adresse' ? 'flex' : 'none';
    document.getElementById('searchParcelle').style.display = mode === 'parcelle' ? 'flex' : 'none';
}

// ============================================================
// GEOLOCATION
// ============================================================
function geolocate() {
    if (!navigator.geolocation) { alert('La géolocalisation n\'est pas supportée par votre navigateur.'); return; }
    showLoading('Géolocalisation en cours...');
    navigator.geolocation.getCurrentPosition(
        async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            // Reverse geocode to get address
            try {
                const r = await safeFetch(`${API.BAN}/reverse/?lon=${lon}&lat=${lat}`, 'Reverse geocode');
                if (r?.features?.length) {
                    const f = r.features[0];
                    addressInput.value = f.properties.label || `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    selectedCoords = { lon, lat };
                    selectedInsee = f.properties.citycode || '';
                    setSearchMode('adresse');
                    hideLoading();
                    launchAnalysis();
                } else {
                    addressInput.value = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    selectedCoords = { lon, lat };
                    hideLoading();
                    alert('Position trouvée mais adresse non identifiée. Lancez l\'analyse manuellement.');
                }
            } catch(e) {
                hideLoading();
                console.error('Reverse geocode:', e);
                alert('Erreur lors du géocodage inverse.');
            }
        },
        (err) => {
            hideLoading();
            alert('Impossible d\'obtenir la position : ' + err.message);
        },
        { enableHighAccuracy: true, timeout: 15000 }
    );
}

// ============================================================
// MAIN ANALYSIS
// ============================================================
async function launchAnalysis() {
    showLoading('Géocodage...');
    // Reset analyse tab so it rebuilds with new parcel data
    window._analyseAlreadyRendered = false;
    window._uploadedFiles = { reglement: null, graphique: null, lotissement: null, plan: null };
    window._extractedTexts = { reglement: '', lotissement: '' };

    try {
        // --- PARCELLE MODE ---
        if (searchMode === 'parcelle') {
            const commune = document.getElementById('parcelleCommune').value.trim();
            const section = document.getElementById('parcelleSection').value.trim().toUpperCase();
            const numero = document.getElementById('parcelleNumero').value.trim().padStart(4, '0');
            if (!commune) { hideLoading(); alert('Veuillez saisir une commune.'); return; }

            // Step 1: Geocode the commune to get INSEE code
            const geoC = await safeFetch(`${API.BAN}/search/?q=${encodeURIComponent(commune)}&type=municipality&limit=1`, 'BAN commune');
            if (!geoC?.features?.length) { hideLoading(); alert('Commune introuvable.'); return; }
            const comF = geoC.features[0];
            const comInsee = comF.properties.citycode || '';
            const comLon = comF.geometry.coordinates[0];
            const comLat = comF.geometry.coordinates[1];

            if (!comInsee) { hideLoading(); alert('Code INSEE non trouvé pour cette commune.'); return; }

            setLoadingText('Recherche de la parcelle...');
            // Step 2: Search the parcelle via API Carto
            let parcelUrl = `${API.CADASTRE}?code_insee=${comInsee}&_limit=1`;
            if (section) parcelUrl += `&section=${section}`;
            if (numero) parcelUrl += `&numero=${numero}`;

            const parcelData = await safeFetch(parcelUrl, 'Cadastre parcelle');
            if (!parcelData?.features?.length) {
                hideLoading();
                alert(`Parcelle non trouvée : commune ${commune}, section ${section}, n° ${numero}.`);
                return;
            }

            // Extract centroid from parcelle geometry
            const geom = parcelData.features[0].geometry;
            let centroid;
            if (geom.type === 'Polygon') {
                const coords = geom.coordinates[0];
                const avgLon = coords.reduce((s, c) => s + c[0], 0) / coords.length;
                const avgLat = coords.reduce((s, c) => s + c[1], 0) / coords.length;
                centroid = { lon: avgLon, lat: avgLat };
            } else if (geom.type === 'MultiPolygon') {
                const coords = geom.coordinates[0][0];
                const avgLon = coords.reduce((s, c) => s + c[0], 0) / coords.length;
                const avgLat = coords.reduce((s, c) => s + c[1], 0) / coords.length;
                centroid = { lon: avgLon, lat: avgLat };
            } else {
                centroid = { lon: comLon, lat: comLat };
            }

            // Set as if address search
            selectedCoords = centroid;
            selectedInsee = comInsee;
            const pp = parcelData.features[0].properties;
            addressInput.value = `Parcelle ${pp.section||''}${pp.numero||''} — ${pp.nom_com||commune}`;
            setSearchMode('adresse');
        }

        // --- ADRESSE MODE ---
        const q = addressInput.value.trim();
        if (!q && !selectedCoords) { hideLoading(); return; }

        if (!selectedCoords) {
            const geo = await safeFetch(`${API.BAN}/search/?q=${encodeURIComponent(q)}&limit=1`, 'BAN');
            if (!geo?.features?.length) { hideLoading(); alert('Adresse introuvable.'); return; }
            const f = geo.features[0];
            selectedCoords = { lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1] };
            selectedInsee = f.properties.citycode || '';
            addressInput.value = f.properties.label;
        }
        const { lon, lat } = selectedCoords;
        const insee = selectedInsee;

        map.setView([lat, lon], 17);
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lon]).addTo(map).bindPopup(addressInput.value).openPopup();

        setLoadingText('Interrogation des API...');
        const geomPoint = JSON.stringify({ type: 'Point', coordinates: [lon, lat] });

        const results = await Promise.allSettled([
            safeFetch(`${API.CADASTRE}?geom=${encodeURIComponent(geomPoint)}&_limit=1`, 'Cadastre'),
            safeFetch(`${API.GPU}/zone-urba?geom=${encodeURIComponent(geomPoint)}`, 'GPU'),
            safeFetch(`${API.GR}/gaspar/risques?latlon=${lat},${lon}&rayon=1000&page=1&page_size=100`, 'GASPAR'),
            safeFetch(`${API.GR}/radon?code_insee=${insee}`, 'Radon'),
            safeFetch(`${API.GR}/zonage_sismique?code_insee=${insee}`, 'Sismique'),
            safeFetch(`${API.GR}/mvt?latlon=${lat},${lon}&rayon=2000&page=1&page_size=10`, 'MVT'),
            safeFetch(`${API.GR}/cavites?latlon=${lat},${lon}&rayon=2000&page=1&page_size=10`, 'Cavites'),
            safeFetch(`${API.GR}/installations_classees?latlon=${lat},${lon}&rayon=2000&page=1&page_size=10`, 'ICPE'),
            fetchBRGM(lon, lat, 'ALEARG', 'Argiles'),
            fetchBRGM(lon, lat, 'REM_NAPPE_SEDIM', 'Nappe sédim.'),
            safeFetch(`${API.GR}/gaspar/ppr?latlon=${lat},${lon}&rayon=5000&page=1&page_size=50`, 'PPR'),
            fetchReglementEcrit(lon, lat, insee),
            fetchCommuneData(insee),
            fetchDVFStats(insee),
        ]);

        const [cadastre, gpu, gaspar, radon, sismique, mvt, cavites, icpe,
               brgmArgiles, brgmNappe, ppr, reglementData, communeData, dvfData] = results.map(r =>
            r.status === 'fulfilled' ? r.value : null
        );

        // Store API data globally for Analyse tab
        window._lastGpu = gpu;
        window._lastGaspar = gaspar;
        window._lastBrgm = brgmArgiles;
        window._lastReglementData = reglementData;
        window._lastCadastre = cadastre;
        window._lastInsee = insee;
        window._lastCoords = { lon, lat };
        window._lastCommune = communeData;

        setLoadingText('Mise en forme...');
        renderParcelleTab(cadastre, lon, lat, insee, communeData);
        renderRisquesTab({ gaspar, radon, sismique, mvt, cavites, icpe, brgmArgiles, brgmNappe, ppr }, lat, lon, insee);
        renderPLUTab(gpu, lon, lat, insee, reglementData);
        renderMarcheTab(lat, lon, insee, addressInput.value, dvfData, communeData);
        renderRaccourcisTab(lon, lat, insee, addressInput.value, reglementData, communeData);
        updateSummary(cadastre, gpu);
        drawParcel(cadastre);

        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('results').style.display = 'block';
        document.getElementById('summaryBar').classList.add('visible');
        document.getElementById('layersPanel').style.display = 'block';
        // Show map click hint if zoomed enough
        if (map.getZoom() >= 15) document.getElementById('mapClickHint').classList.add('visible');
        // Remove any previous clicked parcel highlight
        if (clickedParcelLayer) { map.removeLayer(clickedParcelLayer); clickedParcelLayer = null; }
        hideLoading();
    } catch(err) {
        hideLoading(); console.error('Analyse:', err); alert('Erreur lors de l\'analyse.');
    }
    selectedCoords = null; selectedInsee = null;
}

// ============================================================
// GASPAR + PPR + BRGM Parsers
// ============================================================
function parseGaspar(data) {
    const result = { all: [] };
    if (!data) return result;
    const items = data.data || data.results || (Array.isArray(data) ? data : []);
    items.forEach(item => {
        const risques = item.risques_detail || item.risques || [];
        if (Array.isArray(risques)) {
            risques.forEach(r => {
                const lib = r.libelle_risque_jo || r.lib_risque || r.libelle || '';
                if (lib) result.all.push({ libelle: lib, raw: r });
            });
        }
        const topLib = item.libelle_risque_jo || item.lib_risque || item.libelle || '';
        if (topLib) result.all.push({ libelle: topLib, raw: item });
    });
    return result;
}
function parsePPR(data) {
    const result = [];
    if (!data) return result;
    const items = data.data || data.results || (Array.isArray(data) ? data : []);
    items.forEach(item => {
        result.push({ libelle: item.libelle_risque_jo || item.lib_risque || item.libelle || '', alea: item.alea || item.lib_alea || '', raw: item });
    });
    return result;
}
function parseBRGM(data) {
    if (!data) return null;
    const f = data.features || [];
    if (!f.length) return null;
    return f[0].properties || null;
}

// ============================================================
// Risk Renderers
// ============================================================
function renderArgiles(gaspar, brgmData) {
    const brgm = parseBRGM(brgmData);
    if (brgm) {
        console.log('[BRGM Argiles]', JSON.stringify(brgm));
        const raw = brgm.niveau_alea || brgm.NIVEAU_ALEA || brgm.niveau || brgm.NIVEAU
            || brgm.alea || brgm.ALEA || brgm.expo || brgm.EXPO
            || brgm.CLASSE || brgm.classe || brgm.LIBELLE || brgm.libelle || '';
        const n = String(raw).toLowerCase().trim();
        let lv, bg, ex;
        if (n.includes('fort') || n === '3') { lv='important'; bg='FORT (3/3)'; ex='Exposition forte. <strong>Études géotechniques G1+G2 obligatoires.</strong>'; }
        else if (n.includes('moyen') || n === '2') { lv='modere'; bg='MOYEN (2/3)'; ex='Exposition moyenne. <strong>Étude G1 obligatoire.</strong>'; }
        else if (n.includes('faible') || n === '1') { lv='faible'; bg='FAIBLE (1/3)'; ex='Exposition faible. Étude géotechnique recommandée.'; }
        else if (n.includes('nul') || n === '0' || n.includes('priori')) { lv='non_concerne'; bg='NUL (0/3)'; ex='Zone a priori non concernée.'; }
        else { lv='existant'; bg=raw||'BRGM'; ex=`Donnée BRGM : ${escapeHtml(raw||JSON.stringify(brgm).substring(0,120))}`; }
        return riskCard('&#129704; Retrait-gonflement argiles', lv, bg, ex, 'Source : cartographie BRGM.');
    }
    const m = gaspar.all.filter(r => { const l=r.libelle.toLowerCase(); return l.includes('argile')||l.includes('retrait')||l.includes('gonflement')||l.includes('secheresse')||l.includes('sécheresse'); });
    return riskCard('&#129704; Retrait-gonflement argiles', m.length?'important':'modere',
        m.length?`${m.length} CATNAT`:'&#10140; VOIR RAPPORT',
        m.length?`${m.length} catastrophe(s) naturelle(s) liée(s). <strong>Voir rapport pour le niveau exact.</strong>`
        :'Requête BRGM non aboutie. <strong>Consultez le rapport officiel Géorisques.</strong>',
        '&#9888; Risque critique — vérification obligatoire.');
}

function renderFeuForet(gaspar, pprData) {
    const pprM = pprData.filter(r => { const l=(r.libelle+' '+r.alea).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); return l.includes('feu')||l.includes('foret')||l.includes('incendie'); });
    const gM = gaspar.all.filter(r => { const l=r.libelle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); return l.includes('feu')||l.includes('foret')||l.includes('incendie'); });
    if (pprM.length) return riskCard('&#128293; Feu de forêt','important','PPR EXISTANT',`PPR identifié : ${[...new Set(pprM.map(m=>m.libelle||m.alea))].filter(Boolean).join(', ')}.`,'Source : base PPR.');
    if (gM.length) return riskCard('&#128293; Feu de forêt','existant','EXISTANT',`Risque GASPAR : ${[...new Set(gM.map(m=>m.libelle))].join(', ')}.`,'');
    return riskCard('&#128293; Feu de forêt','non_concerne','NON IDENTIFIÉ','Aucun PPR ni référence GASPAR.','Consultez le rapport officiel en cas de doute.');
}

function renderNappe(gaspar, brgmData) {
    const brgm = parseBRGM(brgmData);
    if (brgm) {
        console.log('[BRGM Nappe]', JSON.stringify(brgm));
        const raw = brgm.sensibilite||brgm.SENSIBILITE||brgm.niveau||brgm.NIVEAU||brgm.alea||brgm.ALEA||brgm.CLASSE||brgm.classe||brgm.LIBELLE||brgm.libelle||'';
        const s = String(raw).toLowerCase();
        let lv,bg,ex;
        if (s.includes('tres')||s.includes('très')||s.includes('fort')) { lv='important'; bg='FORTE'; ex='Zone très sensible. <strong>Risque d\'inondation sous-sols.</strong>'; }
        else if (s.includes('moyen')||s.includes('sensible')) { lv='modere'; bg='MOYENNE'; ex='Sensibilité moyenne aux remontées de nappe.'; }
        else if (s.includes('peu')||s.includes('faible')) { lv='faible'; bg='FAIBLE'; ex='Zone peu sensible.'; }
        else { lv='existant'; bg=raw||'BRGM'; ex=`Donnée BRGM : ${escapeHtml(raw||'voir détail')}.`; }
        return riskCard('&#128167; Remontée de nappe', lv, bg, ex, 'Source : BRGM.');
    }
    const m = gaspar.all.filter(r => { const l=r.libelle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); return l.includes('remontee')||l.includes('nappe'); });
    if (m.length) return riskCard('&#128167; Remontée de nappe','existant','EXISTANT',`${[...new Set(m.map(x=>x.libelle))].join(', ')}.`,'');
    return riskCard('&#128167; Remontée de nappe','non_concerne','NON IDENTIFIÉ','Aucune donnée disponible.','Consultez le rapport officiel.');
}

function renderSismicite(data) {
    if (!data) return riskCard('&#127754; Sismicité','inconnu','INCONNU','Données non disponibles.','');
    const items = data.data||data.results||(Array.isArray(data)?data:[data]);
    if (items.length) {
        const z = String(items[0].code_zone||items[0].zone||'');
        const lab = {'1':'Très faible','2':'Faible','3':'Modérée','4':'Moyenne','5':'Forte'};
        const lev = {'1':'faible','2':'faible','3':'modere','4':'important','5':'important'};
        return riskCard('&#127754; Sismicité',lev[z]||'inconnu',`${z}/5`,`Zone ${z}/5 — ${lab[z]||'?'}.`, z>='2'?'Construction parasismique obligatoire dès le niveau 2.':'');
    }
    return riskCard('&#127754; Sismicité','inconnu','INCONNU','Données non disponibles.','');
}

function renderRadon(data) {
    if (!data) return riskCard('&#9762; Radon','inconnu','INCONNU','Données non disponibles.','');
    const items = data.data||data.results||(Array.isArray(data)?data:[data]);
    if (items.length) {
        const p = String(items[0].classe_potentiel||items[0].potentiel||'');
        const lev = {'1':'faible','2':'modere','3':'important'};
        const lab = {'1':'FAIBLE (1/3)','2':'MODÉRÉ (2/3)','3':'SIGNIFICATIF (3/3)'};
        return riskCard('&#9762; Radon',lev[p]||'inconnu',lab[p]||p,`Potentiel radon : catégorie ${p}/3.`, p==='3'?'Obligation d\'information acquéreurs/locataires.':'');
    }
    return riskCard('&#9762; Radon','inconnu','INCONNU','','');
}

function renderGasparRisk(title, gaspar, keywords, defaultDesc) {
    const m = gaspar.all.filter(r => { const l=r.libelle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); return keywords.some(k=>l.includes(k)); });
    if (m.length) return riskCard(title,'existant','EXISTANT',`Risque identifié : ${[...new Set(m.map(x=>x.libelle))].join(', ')}.`,`${m.length} réf. GASPAR.`);
    return riskCard(title,'non_concerne','NON IDENTIFIÉ',defaultDesc||'Aucun risque identifié.','');
}

function renderMvt(data) {
    if (!data) return riskCard('&#9968; Mouvement de terrain','inconnu','INCONNU','','');
    const i = data.data||data.results||[];
    if (i.length) return riskCard('&#9968; Mouvement de terrain',i.length>=3?'important':'modere',`${i.length} ÉVÉNEMENT(S)`,`${i.length} mouvement(s) de terrain dans un rayon de 2 km.`,'');
    return riskCard('&#9968; Mouvement de terrain','faible','FAIBLE','Aucun mouvement de terrain recensé (rayon 2 km).','');
}

function renderCavites(data) {
    if (!data) return riskCard('&#128371; Cavités souterraines','inconnu','INCONNU','','');
    const i = data.data||data.results||[];
    if (i.length) return riskCard('&#128371; Cavités souterraines',i.length>=3?'important':'modere',`${i.length} CAVITÉ(S)`,`${i.length} cavité(s) dans un rayon de 2 km.`,'');
    return riskCard('&#128371; Cavités souterraines','faible','FAIBLE','Aucune cavité (rayon 2 km).','');
}

function renderICPE(data) {
    if (!data) return riskCard('&#127981; ICPE','inconnu','INCONNU','','');
    const i = data.data||data.results||[];
    if (i.length) {
        const sev = i.filter(x=>(x.regime||'').toLowerCase().includes('seveso'));
        return riskCard('&#127981; ICPE',sev.length?'important':'modere',`${i.length} INSTALL.`,`${i.length} installation(s) classée(s) (2 km).${sev.length?` Dont ${sev.length} Seveso.`:''}`,'');
    }
    return riskCard('&#127981; ICPE','non_concerne','NON CONCERNÉ','Aucune installation classée (rayon 2 km).','');
}

function riskCard(title, level, badge, detail, sub) {
    return `<div class="risk-card ${level}"><div class="risk-header"><span class="risk-title">${title}</span><span class="risk-badge ${level}">${badge}</span></div><div class="risk-detail">${detail}</div>${sub?`<div class="risk-sub">${sub}</div>`:''}</div>`;
}

function renderPLUTab(gpu, lon, lat, insee, reglementData) {
    let h = '';
    if (gpu?.features?.length) {
        const zone = gpu.features[0].properties;
        const libelle = zone.libelle || zone.libelong || '—';
        const typezone = zone.typezone || '';
        const idurba = zone.idurba || '';

        let zoneClass = '';
        if (typezone.startsWith('U') && !typezone.startsWith('AU')) zoneClass = 'U';
        else if (typezone.startsWith('AU')) zoneClass = 'AU';
        else if (typezone.startsWith('A') && !typezone.startsWith('AU')) zoneClass = 'A';
        else if (typezone.startsWith('N')) zoneClass = 'N';

        const zoneDescs = {
            'U':'Zone urbanisée — constructible sous conditions du règlement.',
            'AU':'Zone à urbaniser — urbanisation future, conditions d\'équipement.',
            'A':'Zone agricole — construction très limitée.',
            'N':'Zone naturelle — construction très restreinte.',
        };

        h += `<div class="info-card"><h3>&#127959; Zonage PLU</h3>
            <div class="plu-zone-badge ${zoneClass}">${escapeHtml(libelle)}</div>
            <div class="plu-info" style="margin-bottom:10px;"><strong>Type :</strong> ${typezone}<br>${zoneDescs[zoneClass]||''}</div>

            <div class="info-row"><span class="label">Type de zone</span><span class="value">${typezone||'—'}</span></div>
            ${idurba?`<div class="info-row"><span class="label">Document</span><span class="value">${escapeHtml(idurba)}</span></div>`:''}
        </div>`;

        // Règlement écrit — from GPU API (programmatic fetch)
        if (reglementData && reglementData.url) {
            h += `<div class="info-card" style="border-left:4px solid var(--accent);"><h3>&#128196; Règlement écrit</h3>
                <p class="plu-info" style="margin-bottom:8px;">Règlement du PLU applicable à la zone <strong>${escapeHtml(libelle)}</strong> :</p>
                <a class="link-btn accent" href="${reglementData.url}" target="_blank">&#128196; Télécharger le règlement écrit (PDF)</a>
                <div class="risk-sub" style="margin-top:8px;">Fichier : ${escapeHtml(reglementData.name)}</div></div>`;

        }

        // Other intersected zones
        if (gpu.features.length > 1) {
            h += `<div class="info-card"><h3>&#128200; Autres zones intersectées</h3>`;

                const p = f.properties;

        }
    } else {
        h += `<div class="status-msg warning">Zonage PLU non disponible. Le document n'est peut-être pas publié sur le Géoportail de l'Urbanisme.</div>`;
        // Still try to show règlement if found
        if (reglementData && reglementData.url) {
            h += `<div class="info-card" style="border-left:4px solid var(--accent);"><h3>&#128196; Règlement écrit</h3>
                <a class="link-btn accent" href="${reglementData.url}" target="_blank">&#128196; Télécharger le règlement écrit (PDF)</a>
                <div class="risk-sub" style="margin-top:8px;">Fichier : ${escapeHtml(reglementData.name)}</div></div>`;
        }
    }

    h += `<div class="info-card"><h3>&#128279; Consulter en ligne</h3>
        <a class="link-btn" href="https://www.geoportail-urbanisme.gouv.fr/map/#tile=1&lon=${lon}&lat=${lat}&zoom=19&mlon=${lon}&mlat=${lat}" target="_blank">&#127760; Géoportail de l'Urbanisme (centré sur la parcelle)</a></div>`;

    h += `<div class="info-card"><h3>&#128161; Légende</h3>
        <div class="info-row"><span class="label"><span class="plu-zone-badge U" style="font-size:12px;padding:2px 8px;">U</span></span><span class="value">Urbanisée</span></div>

        <div class="info-row"><span class="label"><span class="plu-zone-badge N" style="font-size:12px;padding:2px 8px;">N</span></span><span class="value">Naturelle</span></div></div>`;

    document.getElementById('tab-plu').innerHTML = h;

// RENDER: Marché immobilier (DVF Stats + Leboncoin + Loyers)
// ============================================================
function renderMarcheTab(lat, lon, insee, adresse, dvfData, communeData) {
    let h = '';
    // Use communeData.nom (from geo.api.gouv.fr) for reliable commune name
    const communeName = communeData?.nom || '';
    const communeSlug = communeName.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const dept = insee ? insee.substring(0, 2) : '';

    const fmt = n => n !== null && n !== undefined ? Math.round(Number(n)).toLocaleString('fr-FR') : '—';

    // ==== 1. DVF — STATS VENTES IMMOBILIÈRES ====
    h += `<div class="info-card"><h3>&#128176; Données DVF — ${escapeHtml(communeName)}</h3>`;

    if (dvfData && Array.isArray(dvfData) && dvfData.length > 0) {
        // Sort by date descending
        const sorted = [...dvfData].sort((a, b) => b.d.localeCompare(a.d));
        const communeLabel = sorted[0].n || communeName;

        // Last 12 months aggregate
        const recent12 = sorted.slice(0, 12);
        const older12 = sorted.slice(12, 24);

        const sumMaisons = recent12.reduce((s, e) => s + (e.m || 0), 0);
        const sumApparts = recent12.reduce((s, e) => s + (e.a || 0), 0);

        // Median of medians (weighted would be better but this is a good approximation)
        const prixMaisonsArr = recent12.filter(e => e.m_m > 0).map(e => e.m_m);
        const prixAppartsArr = recent12.filter(e => e.m_a > 0).map(e => e.m_a);
        const medianOf = arr => { if (!arr.length) return null; arr.sort((a,b) => a-b); const mid = Math.floor(arr.length/2); return arr.length % 2 ? arr[mid] : (arr[mid-1]+arr[mid])/2; };
        const prixMaisons = medianOf(prixMaisonsArr);
        const prixApparts = medianOf(prixAppartsArr);

        // Evolution vs older 12 months
        const prixMaisonsOld = medianOf(older12.filter(e => e.m_m > 0).map(e => e.m_m));
        const prixAppartsOld = medianOf(older12.filter(e => e.m_a > 0).map(e => e.m_a));
        const evolMaisons = (prixMaisons && prixMaisonsOld) ? ((prixMaisons - prixMaisonsOld) / prixMaisonsOld * 100) : null;
        const evolApparts = (prixApparts && prixAppartsOld) ? ((prixApparts - prixAppartsOld) / prixAppartsOld * 100) : null;

        const evolBadge = (val) => {
            if (val === null) return '';
            const color = val >= 0 ? 'var(--risk-low)' : 'var(--risk-high)';
            const arrow = val >= 0 ? '&#9650;' : '&#9660;';
            return `<span style="color:${color};font-weight:700;font-size:12px;margin-left:6px;">${arrow} ${val >= 0 ? '+' : ''}${val.toFixed(1)}%</span>`;
        };

        const periode = recent12.length ? `${recent12[recent12.length-1].d} à ${recent12[0].d}` : '';

        h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">`;

        // Maisons card
        h += `<div style="background:#fdf2f8;padding:14px;border-radius:8px;border-left:4px solid var(--primary);">
            <div style="font-size:12px;color:var(--text-light);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Maisons</div>
            <div style="font-size:26px;font-weight:800;color:var(--primary);margin:4px 0;">${prixMaisons ? fmt(prixMaisons) + ' €/m²' : '—'}</div>
            <div style="font-size:12px;color:var(--text-light);">Prix médian${evolBadge(evolMaisons)}</div>
            <div style="margin-top:8px;font-size:13px;"><strong>${fmt(sumMaisons)}</strong> ventes (12 mois)</div>
        </div>`;

        // Appartements card
        h += `<div style="background:#f0f9ff;padding:14px;border-radius:8px;border-left:4px solid #3b82f6;">
            <div style="font-size:12px;color:var(--text-light);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Appartements</div>
            <div style="font-size:26px;font-weight:800;color:#3b82f6;margin:4px 0;">${prixApparts ? fmt(prixApparts) + ' €/m²' : '—'}</div>
            <div style="font-size:12px;color:var(--text-light);">Prix médian${evolBadge(evolApparts)}</div>
            <div style="margin-top:8px;font-size:13px;"><strong>${fmt(sumApparts)}</strong> ventes (12 mois)</div>
        </div>`;

        h += `</div>`;

        // Evolution chart — simple CSS bar chart for last 24 months of prix maisons
        const chartData = sorted.slice(0, 24).reverse();
        const mValues = chartData.map(e => e.m_m || 0);
        const maxVal = Math.max(...mValues.filter(v => v > 0), 1);

        h += `<div style="margin-bottom:10px;"><strong style="font-size:13px;">Evolution prix médian maisons (€/m²)</strong></div>`;
        h += `<div style="display:flex;align-items:flex-end;gap:2px;height:80px;margin-bottom:4px;">`;
        chartData.forEach(e => {
            const val = e.m_m || 0;
            const pct = val > 0 ? Math.max(4, (val / maxVal) * 100) : 0;
            const color = val > 0 ? 'var(--primary)' : '#e2e8f0';
            const title = `${e.d}: ${val > 0 ? fmt(val) + ' €/m²' : 'N/A'} (${e.m || 0} ventes)`;
            h += `<div style="flex:1;background:${color};height:${pct}%;border-radius:2px 2px 0 0;min-width:8px;opacity:0.85;" title="${title}"></div>`;
        });
        h += `</div>`;
        h += `<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-light);">
            <span>${chartData.length ? chartData[0].d : ''}</span><span>${chartData.length ? chartData[chartData.length-1].d : ''}</span>
        </div>`;

        h += `<div class="risk-sub" style="margin-top:10px;">Période : ${periode} — Source : DVF (data.gouv.fr) — Demandes de Valeurs Foncières.</div>`;
    } else {
        h += `<div class="status-msg warning">Données DVF non disponibles pour cette commune.</div>`;
    }
    h += `</div>`;

    // ==== 2. CARTE DES LOYERS ====
    h += `<div class="info-card"><h3>&#127968; Loyers indicatifs</h3>
        <p class="plu-info" style="margin-bottom:10px;">Indicateurs de loyers d'annonce par commune (Ministère du Logement / data.gouv.fr) :</p>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <a class="link-btn accent" href="https://www.data.gouv.fr/fr/datasets/carte-des-loyers-indicateurs-de-loyers-dannonce-par-commune-en-2025/" target="_blank">&#127968; Carte des loyers 2025 (data.gouv.fr)</a>
        <a class="link-btn secondary" href="https://www.ecologie.gouv.fr/politiques-publiques/carte-loyers" target="_blank">&#127760; Carte interactive (Min. Logement)</a>
        </div>
        <div class="risk-sub" style="margin-top:8px;">Loyers moyens d'annonce par commune — bailleurs privés. Sources : Ministère de la Transition écologique, SeLoger, Leboncoin.</div>
    </div>`;

    // ==== 3. LEBONCOIN — recherche par VILLE (nom commune fiable) ====
    const lbcVille = communeName || 'France';
    const lbcVente = `https://www.leboncoin.fr/recherche?category=9&locations=${encodeURIComponent(lbcVille)}`;
    const lbcTerrain = `https://www.leboncoin.fr/recherche?category=9&real_estate_type=3&locations=${encodeURIComponent(lbcVille)}`;
    const lbcLocation = `https://www.leboncoin.fr/recherche?category=10&locations=${encodeURIComponent(lbcVille)}`;

    h += `<div class="info-card"><h3>&#128269; Leboncoin — ${escapeHtml(lbcVille)}</h3>
        <p class="plu-info" style="margin-bottom:10px;">Recherche par ville sur Leboncoin :</p>
        <a class="link-btn accent" href="${lbcVente}" target="_blank">&#127968; Vente immobilier</a>
        <a class="link-btn accent" href="${lbcTerrain}" target="_blank" style="margin-left:6px;">&#127966; Terrains</a>
        <a class="link-btn secondary" href="${lbcLocation}" target="_blank" style="margin-left:6px;">&#128273; Location</a>
    </div>`;

    // ==== 4. Références prix ====
    h += `<div class="info-card"><h3>&#128200; Références prix immobilier</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <a class="link-btn rose" href="https://www.linternaute.com/ville/${communeSlug}/ville-${insee}/immobilier" target="_blank">&#128200; L'Internaute — Prix</a>
        <a class="link-btn secondary" href="https://app.dvf.etalab.gouv.fr/#${lat.toFixed(3)}/${lon.toFixed(3)}/16" target="_blank">&#127760; DVF Etalab (carte)</a>
        <a class="link-btn secondary" href="https://explore.data.gouv.fr/fr/immobilier?onglet=carte&filtre=tous&code=${insee}&level=commune" target="_blank">&#128202; Explore DVF (data.gouv.fr)</a>
        </div></div>`;

    document.getElementById('tab-marche').innerHTML = h;
}

function updateSummary(cadastre, gpu) {

        ? `${cadastre.features[0].properties.section||''}${cadastre.features[0].properties.numero||''}` : '—';

function drawParcel(cadastre) {
    if (parcelGeoJSON) map.removeLayer(parcelGeoJSON);
    if (cadastre?.features?.length) {
        parcelGeoJSON = L.geoJSON(cadastre, { style: { color: '#F39C12', weight: 3, fillColor: '#F39C12', fillOpacity: 0.15 } }).addTo(map);
        map.fitBounds(parcelGeoJSON.getBounds(), { maxZoom: 18, padding: [40, 40] });
    }
}

function switchTab(name) {
    const tabNames = ['parcelle','risques','plu','marche','raccourcis','analyse'];
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', tabNames[i] === name));
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');
    if (name === 'analyse') renderAnalyseTab();
}

function triggerFileInput(type) {
    document.getElementById(`fileInput_${type}`).click();
}

function handleFileUpload(type, input) {
    if (input.files && input.files[0]) {
        const file = input.files[0];
        window._uploadedFiles[type] = {
            file: file,
            blobUrl: URL.createObjectURL(file)
        };
        const zone = document.getElementById(`upload${type.charAt(0).toUpperCase() + type.slice(1)}`);
        // Keep the hidden file input, just update the visible content
        const existingInput = zone.querySelector('input[type="file"]');
        zone.innerHTML = `<div style="color:var(--primary);font-weight:600;">&#10003; ${escapeHtml(file.name)} (${(file.size/1024).toFixed(1)} KB)</div>`;
        if (existingInput) zone.appendChild(existingInput);
        // Update launch button state
        updateLaunchButtonState();
    }
}

function updateLaunchButtonState() {
    const btn = document.getElementById('btnLaunchAnalysis');
    if (!btn) return;
    const hasReglement = !!window._uploadedFiles.reglement;
    btn.disabled = !hasReglement;
    if (hasReglement) {
        btn.style.opacity = '1';
        btn.title = '';
    } else {
        btn.style.opacity = '0.5';
        btn.title = 'Chargez au moins le règlement écrit PLU';
    }
}

function setupUploadZones() {
    ['reglement', 'graphique', 'lotissement', 'plan'].forEach(type => {
        const zone = document.getElementById(`upload${type.charAt(0).toUpperCase() + type.slice(1)}`);
        if (!zone) return;
        zone.addEventListener('dragover', e => {
            e.preventDefault();
            zone.classList.add('dragover');
        });
        zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
        zone.addEventListener('drop', e => {
            e.preventDefault();
            zone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                const input = document.getElementById(`fileInput_${type}`);
                input.files = e.dataTransfer.files;
                handleFileUpload(type, input);
            }
        });
    });
}

    let html = `<!DOCTYPE html>

    progressText.textContent = 'Extraction du texte des documents...';
