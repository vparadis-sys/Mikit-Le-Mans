                progressText.textContent = 'PLU : ' + msg;
            });
            window._extractedTexts.reglement = reglementText;
        }

        // ── Extract text from Règlement Lotissement ──
        let lotissementText = '';
        if (window._uploadedFiles.lotissement) {
            progressText.textContent = 'Extraction du règlement de lotissement...';
            progressBar.style.width = '30%';
            lotissementText = await extractPDFText(window._uploadedFiles.lotissement.file, msg => {
                progressText.textContent = 'Lotissement : ' + msg;
            });
            window._extractedTexts.lotissement = lotissementText;
        }

        progressBar.style.width = '50%';
        progressText.textContent = 'Analyse des règles d\'urbanisme...';

        // ── Show extracted text panel ──
        const combined = reglementText + '\n\n--- RÈGLEMENT LOTISSEMENT ---\n\n' + lotissementText;
        displayExtractedText(combined);

        // ── Run analysis ──
        const analysisResult = analyzePLUTextRegex(combined);
        window._lastAnalysisResult = analysisResult;
        window._lastAnalysisMode = 'auto';

        progressBar.style.width = '75%';
        progressText.textContent = 'Pré-remplissage du formulaire...';

        // ── Auto-fill form fields ──
        autoFillFormFromAnalysis(analysisResult);

        // ── Auto-fill risks from API data ──
        autoFillRisksFromAPI();

        progressBar.style.width = '100%';
        progressText.textContent = 'Analyse terminée — vérifiez et complétez les champs ci-dessous, puis générez le rapport.';

    } catch(err) {
        console.error('Document analysis error:', err);
        progressText.textContent = 'Erreur lors de l\'analyse : ' + err.message;
    }

    btn.disabled = false;
    btn.innerHTML = '&#128270; Relancer l\'analyse';
}

// ── PDF TEXT EXTRACTION (avec OCR fallback pour PDF scannés) ──
async function extractPDFText(file, progressCallback) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = '';
    let totalChars = 0;

    // Première passe : extraction texte native
    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        // Meilleur assemblage : respecter les espaces entre items
        let pageText = '';
        let lastY = null;
        for (const item of content.items) {
            if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
                pageText += '\n';
            } else if (pageText && !pageText.endsWith(' ') && !pageText.endsWith('\n')) {
                pageText += ' ';
            }
            pageText += item.str;
            lastY = item.transform[5];
        }
        fullText += '\n--- Page ' + i + ' ---\n' + pageText.trim() + '\n';
        totalChars += pageText.trim().length;
    }

    // Si très peu de texte extrait (< 50 chars/page en moyenne) → PDF scanné → OCR
    const avgCharsPerPage = totalChars / pdf.numPages;
    if (avgCharsPerPage < 50 && typeof Tesseract !== 'undefined') {
        if (progressCallback) progressCallback('PDF scanné détecté — lancement OCR (peut prendre 30-60s)...');
        fullText = '';
        try {
            const worker = await Tesseract.createWorker('fra', 1, {
                logger: m => {
                    if (m.status === 'recognizing text' && progressCallback) {
                        progressCallback('OCR page en cours... ' + Math.round((m.progress || 0) * 100) + '%');
                    }
                }
            });
            for (let i = 1; i <= pdf.numPages; i++) {
                if (progressCallback) progressCallback('OCR page ' + i + '/' + pdf.numPages + '...');
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2.0 }); // haute résolution pour meilleur OCR
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                const { data: { text } } = await worker.recognize(canvas);
                fullText += '\n--- Page ' + i + ' (OCR) ---\n' + text.trim() + '\n';
            }
            await worker.terminate();
        } catch (ocrErr) {
            console.error('OCR error:', ocrErr);
            if (progressCallback) progressCallback('Erreur OCR : ' + ocrErr.message);
        }
    }

    return fullText;
}

// ============================================================
// REGEX ANALYSIS ENGINE (v3 — structured extraction)
// ============================================================
function analyzePLUTextRegex(text) {
    const tl = text.toLowerCase();
    // Detect source types
    const hasLotText = tl.includes('--- règlement lotissement ---') || tl.includes('(ocr)');
    const hasLotSection = tl.includes('lotissement') && (tl.includes('permis d\'aménager') || tl.includes('pa '));
    const hasPLU = tl.includes('plu communautaire') || tl.includes('règlement littéral') || tl.includes('zone u mixte');

    // Split text into PLU and Lotissement parts if separator exists
    const sepIdx = text.indexOf('--- RÈGLEMENT LOTISSEMENT ---');
    const pluText = sepIdx > 0 ? text.substring(0, sepIdx) : text;
    const lotText = sepIdx > 0 ? text.substring(sepIdx) : '';
    const pluLow = pluText.toLowerCase();
    const lotLow = lotText.toLowerCase();

    // ── HELPERS ──
    function getSection(txt, startPattern, endPatterns, maxLen = 3000) {
        const rx = new RegExp(startPattern, 'i');
        const m = rx.exec(txt);
        if (!m) return '';
        let end = m.index + maxLen;
        for (const ep of endPatterns) {
            const erx = new RegExp(ep, 'i');
            const em = erx.exec(txt.substring(m.index + 50));
            if (em) end = Math.min(end, m.index + 50 + em.index);
        }
        return txt.substring(m.index, end).trim();
    }

    function extractValue(txt, pattern, captureIdx = 1) {
        const m = txt.match(new RegExp(pattern, 'i'));
        return m ? m[captureIdx] : '';
    }

    function containsAny(txt, ...terms) {
        const low = txt.toLowerCase();
        return terms.some(t => low.includes(t.toLowerCase()));
    }

    function badge(type) {
        return type === 'plu' ? '[PLU]' : type === 'lot' ? '[LOT]' : '[PLU+LOT]';
    }

    // ══════════════════════════════════════════════
    // EMPRISE AU SOL
    // ══════════════════════════════════════════════
    let emprise = '';
    if (containsAny(text, 'pas de cos', 'pas de surface minimale', 'loi alur', 'ALUR')) {
        emprise = 'Pas de COS ni de surface minimale de terrain (loi ALUR).';
    }
    const empriseMatch = text.match(/emprise\s+au\s+sol[^.]*?(\d+)\s*%/i);
    if (empriseMatch) emprise = (emprise ? emprise + ' ' : '') + 'Emprise au sol maxi : ' + empriseMatch[1] + '% ' + badge('plu');
    if (containsAny(lotText, 'zone inconstructible', 'inconstructible', 'règlement graphique')) {
        emprise += (emprise ? '\n' : '') + 'L\'emprise est limitée par les zones inconstructibles du règlement graphique du lotissement. ' + badge('lot');
    }
    if (containsAny(text, 'coefficient nature', 'coefficient « nature')) {
        emprise += (emprise ? '\n' : '') + 'Le coefficient nature du PLU limite également l\'imperméabilisation. ' + badge('plu');
    }

    // ══════════════════════════════════════════════
    // IMPLANTATION / VOIE
    // ══════════════════════════════════════════════
    let recul = '';
    // PLU: bande 0-6m
    if (containsAny(pluText, 'entre 0 et 6 mètres', 'bande comprise entre 0 et 6', '0 et 6 m')) {
        recul = 'Implantation dans une bande de 0 à 6 m à compter de l\'alignement (en l\'absence d\'ordonnancement existant). ' + badge('plu');
    }
    // Lotissement: recul spécifique
    const lotReculMatch = lotText.match(/recul[^.]*?(\d+)\s*m/i);
    if (lotReculMatch) {
        recul += (recul ? '\n' : '') + lotReculMatch[0].substring(0, 200).trim() + ' ' + badge('lot');
    }
    // Lotissement: bande inconstructible en bordure voie
    const lotBandeVoie = lotText.match(/(?:bande|zone)\s+(?:de\s+)?(\d+)\s*m[^.]*(?:voie|bordure)/i);
    if (lotBandeVoie) {
        recul += (recul ? '\n' : '') + 'Zone inconstructible de ' + lotBandeVoie[1] + ' m en bordure des voies. ' + badge('lot');
    }

    // ══════════════════════════════════════════════
    // ALIGNEMENT
    // ══════════════════════════════════════════════
    let alignement = '';
    if (containsAny(pluText, 'entre 0 et 6 mètres', 'bande comprise entre 0 et 6')) {
        alignement = 'Non imposé strictement. Le PLU impose une implantation dans une bande de 0 à 6 m à compter de l\'alignement (en l\'absence d\'ordonnancement existant). ' + badge('plu');
    }
    if (lotText && containsAny(lotText, 'recul', 'garage', '5 m')) {
        const lotAlignInfo = lotText.match(/(?:recul|implantation)[^.]*(?:garage|stationnement)[^.]+/i);
        if (lotAlignInfo) alignement += (alignement ? '\n' : '') + lotAlignInfo[0].substring(0, 250).trim() + ' ' + badge('lot');
    }

    // ══════════════════════════════════════════════
    // LIMITES SÉPARATIVES
    // ══════════════════════════════════════════════
    let lsAutorisee = '';
    let retraitLs = '';
    let zonesInconst = '';

    // PLU LS rules from page 11-12
    // Within 20m band: can build on one or both limits
    if (containsAny(pluText, 'contiguë aux limites séparatives', 'contigüe aux limites séparatives', 'contigue aux limites', 'implanter sur une ou sur les deux limites')) {
        lsAutorisee = 'Autorisée en limite séparative dans la bande de 20 m depuis l\'alignement. ' + badge('plu');
    }
    // PLU LS retrait rules
    if (containsAny(pluText, 'continuité n\'est pas assurée', 'retrait par rapport aux limites séparatives')) {
        // Within 20m: retrait depends on height
        retraitLs = 'Dans la bande de 20 m : si retrait, distance selon hauteur. ' + badge('plu');
    }
    // Beyond 20m: detailed rules
    if (containsAny(pluText, 'au-delà d\'une bande de 20', 'Au-delà d\'une bande de 20')) {
        retraitLs += (retraitLs ? '\n' : '') + 'Au-delà de 20 m : RDC sans combles : en limite possible (H ≤ 3,50 m égout). Si retrait RDC : 2 m min. Constructions à étage : retrait ≥ 3 m (≤ 2 niveaux / 7 m égout) ou ≥ hauteur construction. ' + badge('plu');
    }

    // Lotissement LS rules
    if (lotText) {
        const lotLsMatch = lotText.match(/(?:limit[eé]s?\s+s[ée]parative|en\s+limite)[^.]{0,400}/i);
        if (lotLsMatch) {
            lsAutorisee += (lsAutorisee ? '\n' : '') + lotLsMatch[0].substring(0, 300).trim() + ' ' + badge('lot');
        }
        // LS retrait lotissement
        const lotLsRetrait = lotText.match(/retrait[^.]*limit[eé][^.]*?(\d+)\s*m/i);
        if (lotLsRetrait) {
            retraitLs += (retraitLs ? '\n' : '') + 'Lotissement : retrait de ' + lotLsRetrait[1] + ' m ' + badge('lot');
        }
    }

    // PLU annexes LS
    if (containsAny(pluText, 'annexes* peuvent joindre les limites', 'annexes peuvent joindre')) {
        lsAutorisee += (lsAutorisee ? '\n' : '') + 'Annexes : peuvent être implantées en limite séparative. Si retrait : 1 m minimum. Piscines : retrait 2 m. ' + badge('plu');
    }

    // Zones inconstructibles
    const incParts = [];
    // From lotissement
    if (lotText) {
        const incMatches = lotText.match(/(?:bande|zone)\s+(?:de\s+)?(\d+)\s*m[^.]*inconstructible[^.]*/gi) ||
                           lotText.match(/inconstructible[^.]*(?:bande|zone)\s+(?:de\s+)?(\d+)\s*m[^.]*/gi);
        if (incMatches) incMatches.forEach(m => incParts.push(m.substring(0, 250).trim() + ' ' + badge('lot')));

        // SNCF / voie ferrée zones
        const sncfMatch = lotText.match(/(?:bande|zone)\s+(?:de\s+)?(\d+)\s*m[^.]*(?:SNCF|ferr[ée]|ferroviaire)[^.]*/i) ||
                          lotText.match(/(?:SNCF|ferr[ée]|ferroviaire)[^.]*(?:bande|zone)\s+(?:de\s+)?(\d+)\s*m[^.]*/i);
        if (sncfMatch) incParts.push(sncfMatch[0].substring(0, 250).trim() + ' ' + badge('lot'));
    }
    // From PLU - domaine ferroviaire
    if (containsAny(pluText, 'domaine public ferroviaire', 'retrait par rapport au domaine public ferroviaire')) {
        incParts.push('Retrait obligatoire par rapport au domaine public ferroviaire : ≥ 5 m pour habitations, ≥ 2 m pour annexes. ' + badge('plu'));
    }
    zonesInconst = incParts.join('\n');

    // ══════════════════════════════════════════════
    // HAUTEUR
    // ══════════════════════════════════════════════
    let hauteurMax = '';
    let hauteurMesure = '';
    let niveaux = '';
    let hauteurAnnexes = '';

    // PLU page 9: hauteurs définies dans le plan des hauteurs
    if (containsAny(pluText, 'plan des hauteurs', 'hauteurs à respecter sont définies dans le plan')) {
        hauteurMax = 'Les hauteurs sont définies dans le plan des hauteurs du PLU (se reporter au document graphique). ' + badge('plu');
    }

    // Lotissement: hauteur spécifique
    const lotHautMatch = lotText.match(/hauteur[^.]*?(\d+)\s*m[èe]tre[s]?\s*(?:à\s+l'[ée]gout|maximum|maxi)/i) ||
                         lotText.match(/(\d+)\s*m[èe]tre[s]?\s*(?:à\s+l'[ée]gout|au\s+fa[îi]tage)/i);
    if (lotHautMatch) {
        hauteurMax += (hauteurMax ? '\n' : '') + lotHautMatch[0].substring(0, 200).trim() + ' ' + badge('lot');
    }
    const lotNivMatch = lotText.match(/(\d+)\s*niveau[x]?\s*(?:maxi|max\b|au\s+dessus)/i);
    if (lotNivMatch) {
        niveaux = lotNivMatch[1] + ' niveaux maximum (RDC compris). ' + badge('lot');
    }

    // PLU: annexes 3m égout + 4.5m faîtage
    if (containsAny(pluText, 'annexes* ne doit pas excéder 3 mètres', 'annexes ne doit pas excéder 3', 'constructions annexes* ne doit pas excéder 3')) {
        hauteurAnnexes = '3 m à l\'égout du toit et 4,5 m au faîtage maximum. ' + badge('plu');
    }

    // PLU: un seul niveau habitable dans combles ou retrait
    if (containsAny(pluText, 'un seul niveau habitable peut être aménagé', 'Un seul niveau habitable')) {
        niveaux += (niveaux ? '\n' : '') + '1 seul niveau habitable supplémentaire possible (dans les combles si toiture à pentes, ou en retrait si toit-terrasse : retrait ≥ 1,5 m du nu de façade, hauteur ≤ 3 m à l\'égout). ' + badge('plu');
    }

    // Detect measurement point
    hauteurMesure = 'Égout du toit';
    if (containsAny(text, 'faîtage')) hauteurMesure += ' / Faîtage';
    if (containsAny(text, 'acrotère')) hauteurMesure += ' / Acrotère (toit-terrasse)';

    // ══════════════════════════════════════════════
    // TOITURE & ASPECT
    // ══════════════════════════════════════════════
    let pentes = '';
    // Lotissement pentes
    if (lotText) {
        if (containsAny(lotText, '2 pentes', 'deux pentes')) pentes = 'Toiture à 2 pentes obligatoire. ' + badge('lot');
        if (containsAny(lotText, '4 pentes', 'quatre pentes', 'croupe')) {
            pentes += (pentes ? '\n' : '') + 'Toitures à 4 pentes et croupes INTERDITES. ' + badge('lot');
        }
        if (!pentes) {
            const lotPenteMatch = lotText.match(/pente[^.]{0,200}/i);
            if (lotPenteMatch) pentes = lotPenteMatch[0].substring(0, 200).trim() + ' ' + badge('lot');
        }
    }
    if (!pentes && pluText) {
        // Only match specific roof slope rules (e.g. "toiture à 2 pentes")
        const pluPenteMatch = pluText.match(/(?:toiture[s]?\s+(?:à|en)\s+\d+\s+pente|pente[s]?\s+(?:de|du)\s+toit(?:ure)?[^.]*(?:\d+|obligat|interdi))[^.]{0,200}/i);
        if (pluPenteMatch) pentes = pluPenteMatch[0].substring(0, 300).trim() + ' ' + badge('plu');
        // If still no pente rule, indicate from PLU couverture section
        if (!pentes && containsAny(pluText, 'couvertures en pente')) {
            pentes = 'Couvertures en pente prescrites pour habitations et annexes. ' + badge('plu');
        }
    }

    let faitage = '';
    if (lotText) {
        const lotFaitMatch = lotText.match(/fa[îi]t(?:age|ière)[^.]{0,200}/i);
        if (lotFaitMatch) faitage = lotFaitMatch[0].substring(0, 200).trim() + ' ' + badge('lot');
    }
    if (!faitage) faitage = 'Non spécifié — libre';

    let couverture = '';
    // PLU: ardoises / tuiles
    if (containsAny(pluText, 'ardoises naturelles', 'fibro ardoises', 'fibro-ardoises')) {
        couverture = 'Ardoises naturelles (ou fibro-ardoises)';
    }
    if (containsAny(pluText, 'tuiles d\'aspect plat', 'tuile d\'aspect plat', 'teinte terre cuite')) {
        couverture += (couverture ? ', ou ' : '') + 'tuiles d\'aspect plat de teinte terre cuite foncée (type 65/m² minimum)';
    }
    if (couverture) couverture += '. ' + badge('plu');
    if (containsAny(pluText, 'énergies renouvelables', 'matériaux pour énergies')) {
        couverture += '\nMatériaux pour énergies renouvelables autorisés.';
    }
    if (containsAny(pluText, 'toitures végétalisées')) couverture += ' Toitures végétalisées autorisées.';
    // Lotissement couverture
    if (lotText) {
        const lotCouvMatch = lotText.match(/couverture[^.]{0,300}/i) || lotText.match(/(?:tuile|ardoise)[^.]{0,200}/i);
        if (lotCouvMatch) couverture += (couverture ? '\n' : '') + lotCouvMatch[0].substring(0, 250).trim() + ' ' + badge('lot');
    }

    let enduit = '';
    // Lotissement: couleur claire, blanc interdit
    if (containsAny(lotText, 'couleur claire', 'teinte claire')) enduit = 'Couleur claire obligatoire. ';
    if (containsAny(lotText, 'blanc interdit', 'blanc est interdit')) enduit += 'BLANC INTERDIT. ';
    if (enduit && lotText) enduit += badge('lot');
    // PLU: emploi à nu interdit
    if (containsAny(pluText, 'emploi à nu de matériaux destinés à être enduits est interdit', 'emploi à nu')) {
        enduit += (enduit ? '\n' : '') + 'L\'emploi à nu de matériaux destinés à être enduits est interdit. ' + badge('plu');
    }
    // Lotissement: harmonisation
    if (containsAny(lotText, 'harmoni')) {
        enduit += (enduit ? '\n' : '') + 'Harmonisation avec les enduits des constructions existantes exigée. ' + badge('lot');
    }

    let menuiseries = '';
    if (lotText) {
        if (containsAny(lotText, 'une seule teinte', 'seule teinte')) {
            menuiseries = 'Une seule teinte par habitation pour portes et fenêtres (sauf fenêtres de toit). ';
        }
        if (containsAny(lotText, 'porte d\'entrée', 'porte du garage', 'teinte différente')) {
            menuiseries += 'La porte d\'entrée et la porte du garage peuvent avoir une teinte différente. ';
        }
        if (menuiseries) menuiseries += badge('lot');
        if (!menuiseries) {
            const lotMenuMatch = lotText.match(/menuiserie[^.]{0,300}/i);
            if (lotMenuMatch) menuiseries = lotMenuMatch[0].substring(0, 250).trim() + ' ' + badge('lot');
        }
    }

    let cheminee = '';
    // Only match actual cheminee rules, not mentions in lists
    const chemMatch = text.match(/chemin[ée]e[s]?\s+(?:doivent|devront|obligat|interdi|seront|sont|ne\s+doivent)[^.]{0,200}/i) ||
                      lotText.match(/chemin[ée]e[^.]{0,200}/i);
    if (chemMatch) cheminee = chemMatch[0].substring(0, 200).trim();

    let abf = 'Non mentionné pour ce secteur.';
    // Only flag ABF if lotissement mentions it specifically, or if the PLU mentions it for the specific zone
    if (lotText && containsAny(lotText, 'ABF', 'architecte des bâtiments', 'monument historique', 'AVAP', 'SPR')) {
        const abfMatch = lotText.match(/(?:ABF|architecte.*bâtiment|monument.*historique|AVAP|SPR)[^.]{0,300}/i);
        if (abfMatch) abf = abfMatch[0].substring(0, 300).trim() + ' ' + badge('lot');
    }

    let annexesAspect = '';
    if (lotText) {
        if (containsAny(lotText, 'annexe', 'abri de jardin', 'abri jardin')) {

            if (lotAnnMatch) annexesAspect = lotAnnMatch[0].substring(0, 350).trim() + ' ' + badge('lot');
        }
    }
    if (containsAny(pluText, 'annexes* doivent présenter', 'constructions annexes* doivent')) {
        annexesAspect += (annexesAspect ? '\n' : '') + 'Les constructions annexes doivent présenter un aspect harmonieux (cohérence matériaux/couleurs). ' + badge('plu');
    }

    // ══════════════════════════════════════════════
    // STATIONNEMENT
    // ══════════════════════════════════════════════
    let statNb = '';
    let statType = '';
    let statVelos = '';
    let statVisiteurs = '';

    // PLU page 18: normes par taille logement
    if (containsAny(pluText, '2 places par logement', '2 places par\nlogement')) {
        statNb = '2 places par logement (secteur périurbain, logement ≥ 100 m² de SDP). ' + badge('plu');
    } else if (containsAny(pluText, '1,5 place par logement')) {
        statNb = '1,5 place par logement (logement de 50 à 99 m² de SDP, secteur périurbain). ' + badge('plu');
    }
    // Lotissement: surface / espace
    if (lotText) {
        const lotStatMatch = lotText.match(/(?:stationnement|parking|place)[^.]*?(\d+)\s*m[²2]/i);
        if (lotStatMatch) {
            statNb += (statNb ? '\n' : '') + 'Lotissement : espace d\'au moins ' + lotStatMatch[1] + ' m² pour le stationnement. ' + badge('lot');
        }
    }

    // Type
    if (containsAny(lotText, 'carport', 'car port')) {
        statType = 'Le garage peut être remplacé par un carport en structure bois non clos sur les côtés. ' + badge('lot');
    } else if (containsAny(lotText, 'garage')) {
        statType = 'Garage. ' + badge('lot');
    }

    // Visiteurs PLU
    if (containsAny(pluText, '1 place par tranche', 'tranche entamée de 2 logements')) {
        statVisiteurs = 'Lotissement : 1 place par tranche de 2 logements (mutualisé). ' + badge('plu');
    }

    // Vélos PLU page 20
    if (containsAny(pluText, '2 places/logement', '2 places par logement') && containsAny(pluText, 'vélo', 'cycle')) {
        statVelos = '2 places/logement (SDP ≥ 50 m²). Local clos ou sécurisé, couvert, aisément accessible. ' + badge('plu');
    } else if (containsAny(pluText, '1 place/logement') && containsAny(pluText, 'vélo', 'cycle')) {
        statVelos = '1 place/logement (SDP < 50 m²). ' + badge('plu');
    }

    // ══════════════════════════════════════════════
    // ACCÈS
    // ══════════════════════════════════════════════
    let accesLargeur = '';
    let accesRestrictions = '';

    // PLU: 1 accès par voie
    if (containsAny(pluText, 'plus d\'un accès par voie', 'un accès par voie')) {
        accesLargeur = '1 seul accès par voie desservant le terrain. ' + badge('plu');
    }
    // PLU: accès RD interdit
    if (containsAny(pluText, 'accès directs sur les routes départementales', 'nouveaux accès directs sur les routes départementales')) {
        accesRestrictions = 'Création de nouveaux accès directs sur les routes départementales INTERDITE (sauf absence d\'alternative, après avis du gestionnaire). ' + badge('plu');
    }
    // Lotissement: accès dimensions
    if (lotText) {
        const lotAccMatch = lotText.match(/acc[èe]s[^.]*?(\d+)\s*m\s*[x×]\s*(\d+)\s*m/i);
        if (lotAccMatch) {
            accesLargeur += (accesLargeur ? '\n' : '') + 'Accès imposé : ' + lotAccMatch[1] + ' m × ' + lotAccMatch[2] + ' m. ' + badge('lot');
        }
        if (containsAny(lotText, '1 seul accès', 'un seul accès')) {
            accesLargeur = '1 seul accès autorisé par lot. ' + badge('lot') + (accesLargeur ? '\n' + accesLargeur : '');
        }
    }

    // ══════════════════════════════════════════════
    // RÉSEAUX
    // ══════════════════════════════════════════════
    let eauxUsees = '';
    if (containsAny(pluText, 'raccordé au réseau public d\'assainissement', 'raccordement au réseau public')) {
        eauxUsees = 'Raccordement au réseau public d\'assainissement obligatoire. ' + badge('plu');
    }

    let eauxPluviales = '';
    if (containsAny(pluText, 'gestion des eaux pluviales', 'infiltration totale ou partielle')) {
        eauxPluviales = 'Gestion à la parcelle obligatoire — dispositifs de gestion des EP avant infiltration totale ou partielle de la pluie de référence. Si rejet, vers l\'exutoire désigné par le gestionnaire. ' + badge('plu');
    }
    if (containsAny(lotText, 'eaux pluviales', 'gestion.*EP', 'note hydraulique')) {
        const lotEPMatch = lotText.match(/(?:eaux\s+pluviales|gestion\s+des\s+EP|note\s+hydraulique)[^.]{0,300}/i);
        if (lotEPMatch) eauxPluviales += (eauxPluviales ? '\n' : '') + lotEPMatch[0].substring(0, 250).trim() + ' ' + badge('lot');
    }

    let autresReseaux = '';
    if (containsAny(pluText, 'réseaux publics et les branchements privés', 'entièrement souterrains')) {
        autresReseaux = 'Réseaux souterrains obligatoires (opération d\'aménagement d\'ensemble). ' + badge('plu');
    }
    if (containsAny(pluText, 'fourreaux nécessaires', 'communications électroniques')) {
        autresReseaux += (autresReseaux ? '\n' : '') + 'Fourreaux pour communications électroniques obligatoires. ' + badge('plu');
    }
    if (lotText) {
        const reseauTerms = [];
        if (containsAny(lotText, 'ENEDIS', 'BT')) reseauTerms.push('ENEDIS BT');
        if (containsAny(lotText, 'GRDF', 'gaz')) reseauTerms.push('GRDF');
        if (containsAny(lotText, 'fibre', 'télécom', 'TELECOM')) reseauTerms.push('Télécom + Fibre');
        if (reseauTerms.length) {
            autresReseaux += (autresReseaux ? '\n' : '') + 'Coffrets/regards prévus : ' + reseauTerms.join(', ') + '. ' + badge('lot');
        }
    }

    // ══════════════════════════════════════════════
    // CLÔTURES
    // ══════════════════════════════════════════════
    let cloturesVoie = '';
    let cloturesLat = '';

    // PLU: clôtures U mixte
    if (containsAny(pluText, 'clôtures doivent présenter un aspect sobre')) {
        cloturesVoie = 'Aspect sobre et homogène obligatoire. ' + badge('plu');
    }
    // PLU: hauteur max clôtures
    const pluClotMaxMatch = pluText.match(/cl[ôo]tures?\s+(?:devront\s+respecter|doivent\s+respecter)?\s*(?:une\s+)?hauteur\s*\*?\s*(?:maximale|max)\s+(?:de\s+)?(\d+(?:[,.]\d+)?)\s*m/i);
    if (pluClotMaxMatch) {
        cloturesLat = 'PLU : hauteur max ' + pluClotMaxMatch[1].replace(',', '.') + ' m. ' + badge('plu');
    }
    // PLU: clôtures pleines max
    const pluPleineMatch = pluText.match(/cl[ôo]tures?\s+pleines?[^.]*?(\d+(?:[,.]\d+)?)\s*m[èe]tre/i);
    if (pluPleineMatch) {
        cloturesVoie += (cloturesVoie ? '\n' : '') + 'Clôtures pleines max ' + pluPleineMatch[1].replace(',', '.') + ' m le long des voies. ' + badge('plu');
    }
    // PLU: bâche/canisses interdit
    if (containsAny(pluText, 'bâche', 'canisses', 'plastiques est interdit')) {
        cloturesVoie += (cloturesVoie ? '\n' : '') + 'Usage de bâche ou canisses plastiques interdit en limite de voie. ' + badge('plu');
    }

    // Lotissement clôtures
    if (lotText) {
        if (containsAny(lotText, 'ajouré', 'ajourée')) {
            const lotClotH = lotText.match(/(?:ajouré|clôture)[^.]*?(\d+(?:[,.]\d+)?)\s*m/i);
            if (lotClotH) {
                cloturesVoie += (cloturesVoie ? '\n' : '') + 'Ajourées obligatoirement, hauteur maxi ' + lotClotH[1].replace(',', '.') + ' m. ' + badge('lot');
            }
        }
        const lotClotTypes = lotText.match(/(?:cl[ôo]ture|grillage|palissade|haie)[^.]{0,300}(?:autoris|oblig|type)/i);
        if (lotClotTypes) cloturesVoie += (cloturesVoie ? '\n' : '') + lotClotTypes[0].substring(0, 250).trim() + ' ' + badge('lot');

        // Clôtures latérales lotissement
        const lotClotLat = lotText.match(/(?:lat[ée]ral|fond|séparati)[^.]*(\d+(?:[,.]\d+)?)\s*m/i);
        if (lotClotLat) {
            cloturesLat = (cloturesLat ? cloturesLat + '\n' : '') + 'Lotissement : hauteur maxi ' + lotClotLat[1].replace(',', '.') + ' m en limites latérales/fond. ' + badge('lot');
        }
    }

    // ══════════════════════════════════════════════
    // VÉGÉTATION / ARBRES
    // ══════════════════════════════════════════════
    let arbres = '';
    if (containsAny(pluText, 'arbres de haute tige', 'maintenus ou remplacés')) {
        arbres = 'Si arbres de haute tige existants : maintien ou remplacement obligatoire (1 arbre / 100 m² d\'espaces libres minimum). ' + badge('plu');
    }
    let vegetation = '';
    if (containsAny(pluText, 'coefficient « nature', 'coefficient nature')) {
        vegetation = 'Coefficient nature réglementé en zone U Mixte — se reporter au plan de coefficient nature du PLU. ' + badge('plu');
    }
    if (lotText && containsAny(lotText, 'perméabilité', 'nature', 'végétal')) {
        const lotVegMatch = lotText.match(/(?:perméabilité|coefficient|nature|végétal)[^.]{0,300}/i);
        if (lotVegMatch) vegetation += (vegetation ? '\n' : '') + lotVegMatch[0].substring(0, 250).trim() + ' ' + badge('lot');
    }

    // ══════════════════════════════════════════════
    // ALTIMÉTRIE / NGF / DALLE RDC
    // ══════════════════════════════════════════════
    let altimetrie = '';
    if (containsAny(text, 'altimétri', 'NGF', 'nivellement')) {
        const altMatch = text.match(/(?:altim[ée]tri|NGF|nivellement|cote)[^.]{0,300}/i);
        if (altMatch) altimetrie = altMatch[0].substring(0, 250).trim();
    }
    if (!altimetrie) altimetrie = 'Non spécifié dans les documents fournis. À vérifier auprès de la mairie (cotes NGF pour PC).';

    let dalleRdc = '';
    // Only match actual "dalle RDC" or "plancher bas" rules related to construction height
    const dallePatterns = [
        /(?:dalle\s+(?:RDC|rez-de-chauss[ée]e|du\s+rez))\s+(?:fini|mini|minimum|à|au\s+moins)[^.]{0,200}/i,
        /(?:hauteur\s+(?:mini|minimum)\s+(?:de\s+la\s+)?dalle)[^.]{0,200}/i,
        /(?:plancher\s+bas\s+fini)[^.]{0,200}/i
    ];
    for (const dp of dallePatterns) {
        const dalleMatch = text.match(dp);
        if (dalleMatch) { dalleRdc = dalleMatch[0].substring(0, 200).trim(); break; }
    }
    if (!dalleRdc) dalleRdc = 'Non spécifié. À déterminer selon étude de sol et visite terrain.';

    // ══════════════════════════════════════════════
    // CONTRAINTES SPÉCIALES (voie ferrée, etc.)
    // ══════════════════════════════════════════════
    let autresContraintes = '';
    if (containsAny(text, 'SNCF', 'ferré', 'ferrée', 'ferroviaire', 'voie ferrée', 'rail')) {
        autresContraintes = 'Proximité voie ferrée — ';
        if (containsAny(pluText, 'domaine public ferroviaire')) {
            autresContraintes += 'Servitude T1 applicable (domaine public ferroviaire). Retrait habitations ≥ 5 m, annexes ≥ 2 m. ' + badge('plu');
        }
        if (containsAny(lotText, 'SNCF', 'ferr')) {
            const lotSncfMatch = lotText.match(/(?:SNCF|ferr[ée]|ferroviaire)[^.]{0,300}/i);
            if (lotSncfMatch) autresContraintes += '\n' + lotSncfMatch[0].substring(0, 250).trim() + ' ' + badge('lot');
        }
        autresContraintes += '\nNuisances sonores possibles — prévoir éventuellement une étude acoustique.';
    }
    if (containsAny(text, 'bruit', 'acousti', 'nuisance sonore', 'isolation phonique')) {
        if (!autresContraintes.includes('acoustique')) {
            const bruitMatch = text.match(/(?:bruit|acousti|nuisance\s+sonore)[^.]{0,200}/i);
            if (bruitMatch) autresContraintes += (autresContraintes ? '\n' : '') + bruitMatch[0].substring(0, 200).trim();
        }
    }

    // ══════════════════════════════════════════════
    // BUILD STRUCTURED RESULT
    // ══════════════════════════════════════════════
    const gpu = window._lastGpu;
    const result = {
        identification: {
            commune_idurba: gpu?.features?.[0]?.properties?.idurba || '',
            zone: gpu?.features?.[0]?.properties?.libelle || '',
            emprise_sol: emprise || 'Non détecté dans les documents fournis'
        },
        implantation: {
            recul_rue: recul || 'Non détecté dans les documents fournis',
            alignement: alignement || 'Non détecté',
            ls_autorisee: lsAutorisee || 'Non détecté',
            ls_imposee: '',
            retrait_ls: retraitLs || 'Non détecté',
            zones_inconstructibles: zonesInconst || ''
        },
        hauteur: {
            hauteur_max: hauteurMax || 'Non détecté dans les documents fournis',
            mesure: hauteurMesure || '',
            niveaux: niveaux || '',
            annexes: hauteurAnnexes || ''
        },
        risques: {
            ppri: '',
            secheresse_argiles: '',
            altimetrie: altimetrie,
            dalle_rdc: dalleRdc,
            autres: autresContraintes || ''
        },
        toiture_aspect: {
            pentes: pentes || 'Non détecté dans les documents fournis',
            faitage: faitage,
            couverture: couverture || 'Non détecté',
            enduit: enduit || 'Non détecté',
            menuiseries: menuiseries || '',
            cheminee: cheminee || '',
            abf: abf,
            annexes_aspect: annexesAspect || ''
        },
        stationnement: {
            nb_places: statNb || 'Non détecté dans les documents fournis',
            type: statType || '',
            surface: '',
            velos: statVelos || '',
            visiteurs: statVisiteurs || ''
        },
        acces: {
            largeur: accesLargeur || 'Non détecté dans les documents fournis',
            restrictions: accesRestrictions || ''
        },
        reseaux: {
            eaux_usees: eauxUsees || 'Non détecté',
            eaux_pluviales: eauxPluviales || 'Non détecté',
            autres_reseaux: autresReseaux || ''
        },
        amenagements: {
            clotures_voie: cloturesVoie || 'Non détecté dans les documents fournis',
            clotures_laterales: cloturesLat || '',
            arbres: arbres || '',
            vegetation: vegetation || '',
            autres: ''
        },
        synthese: {
            points_critiques: [],
            points_vigilance: [],
            atouts: []
        }
    };

    // ── AUTO-GENERATE SYNTHESIS ──
    // Points critiques
    if (containsAny(text, 'SNCF', 'ferré', 'ferrée', 'ferroviaire')) {
        result.synthese.points_critiques.push('Proximité voie ferrée — zone inconstructible et nuisances sonores potentielles');
    }
    if (accesRestrictions.toLowerCase().includes('interdit')) {
        result.synthese.points_critiques.push('Accès sur route départementale interdit — accès uniquement par voie interne');
    }

    // Points de vigilance
    if (zonesInconst) {
        result.synthese.points_vigilance.push('Zones inconstructibles identifiées — vérifier l\'impact sur l\'emprise constructible');
    }
    result.synthese.points_vigilance.push('Coefficient nature exact à vérifier (plan du PLU)');
    result.synthese.points_vigilance.push('Hauteur exacte autorisée à vérifier (plan des hauteurs du PLU)');
    if (altimetrie.includes('Non spécifié') || altimetrie.includes('vérifier')) {
        result.synthese.points_vigilance.push('Cotes NGF éventuelles à vérifier pour le PC');
    }
    if (eauxPluviales.includes('note hydraulique') || containsAny(lotText, 'note hydraulique')) {
        result.synthese.points_vigilance.push('Note hydraulique du lotissement (gestion EP) à consulter');
    }
    result.synthese.points_vigilance.push('Étude de sol recommandée (type de fondation, adaptation au terrain)');

    // Atouts
    if (lsAutorisee.toLowerCase().includes('autoris')) {
        result.synthese.atouts.push('Construction en limite séparative autorisée (optimisation de l\'emprise)');
    }
    if (statType.toLowerCase().includes('carport')) {
        result.synthese.atouts.push('Carport autorisé à la place du garage (flexibilité d\'implantation)');
    }
    if (eauxUsees.includes('réseau public') || autresReseaux.includes('souterrain')) {
        result.synthese.atouts.push('Terrain viabilisé (raccordement aux réseaux publics)');
    }

    return result;
}

// ============================================================
// AUTO-FILL FORM FROM ANALYSIS RESULT
// ============================================================
function autoFillFormFromAnalysis(ai) {
    const fields = {
        'plu_emprise': ai.identification?.emprise_sol,
        'plu_recul_rue': ai.implantation?.recul_rue,
        'plu_hauteur_max': ai.hauteur?.hauteur_max,
        'plu_hauteur_precision': ai.hauteur?.mesure,
        'plu_pentes': ai.toiture_aspect?.pentes,
        'plu_faitage_detail': ai.toiture_aspect?.faitage,
        'plu_couverture': ai.toiture_aspect?.couverture,
        'plu_enduit': ai.toiture_aspect?.enduit,
        'plu_menuiseries': ai.toiture_aspect?.menuiseries,
        'plu_cheminee': ai.toiture_aspect?.cheminee,
        'plu_abf_detail': ai.toiture_aspect?.abf,
        'plu_stationnement_nb': ai.stationnement?.nb_places,
        'plu_stationnement_surface': ai.stationnement?.surface,
        'plu_stationnement_special': ai.stationnement?.velos,
        'plu_acces_largeur': ai.acces?.largeur,
        'plu_ppri': ai.risques?.ppri,
        'plu_secheresse': ai.risques?.secheresse_argiles,
        'plu_altimetrie': ai.risques?.altimetrie,
        'plu_cotes_ngf': '',
        'plu_dalle_rdc': ai.risques?.dalle_rdc,
        'plu_reseaux_usees': ai.reseaux?.eaux_usees,
        'plu_reseaux_pluviales': ai.reseaux?.eaux_pluviales,
        'plu_cloturesF': (ai.amenagements?.clotures_voie || '') + (ai.amenagements?.clotures_laterales ? '\n\nLatérales/fond : ' + ai.amenagements.clotures_laterales : ''),
        'plu_vegetation': ai.amenagements?.vegetation,
        'plu_arbres_detail': ai.amenagements?.arbres,
        'plu_aspect_autre': ai.toiture_aspect?.annexes_aspect,
        'plu_amenagements_autre': ai.amenagements?.autres,
    };

    for (const [id, value] of Object.entries(fields)) {
        if (value && value !== 'Non détecté' && value !== 'Non spécifié') {
            const el = document.getElementById(id);
            if (el) {
                el.value = typeof value === 'string' ? value.substring(0, el.tagName === 'TEXTAREA' ? 2000 : 500) : value;
                el.classList.add('auto-filled');
                addAutoBadge(el, 'AUTO');
            }
        }
    }

    // Handle selects with best-effort matching
    const lsText = (ai.implantation?.ls_autorisee || '').toLowerCase();
    if (lsText.includes('autoris') || lsText.includes('oui')) setSelectValue('plu_ls_autorisee', 'oui', 'IA');
    else if (lsText.includes('interdi') || lsText.includes('non')) setSelectValue('plu_ls_autorisee', 'non', 'IA');
    else if (lsText.includes('condition')) setSelectValue('plu_ls_autorisee', 'sous_conditions', 'IA');

    // Fill LS details in text fields
    if (ai.implantation?.retrait_ls) {
        const el = document.getElementById('plu_retrait_ls');
        if (el) { el.value = ai.implantation.retrait_ls.substring(0, 500); el.classList.add('auto-filled'); addAutoBadge(el, 'AUTO'); }
    }
    if (ai.implantation?.zones_inconstructibles) {
        const el = document.getElementById('plu_aspect_autre');
        if (el && !el.value) { el.value = 'Zones inconstructibles : ' + ai.implantation.zones_inconstructibles.substring(0, 800); el.classList.add('auto-filled'); }
    }
}

function setSelectValue(id, value, badge) {
    const el = document.getElementById(id);
    if (el) {
        // Check if value exists in options
        const options = Array.from(el.options).map(o => o.value);
        if (options.includes(value)) {
            el.value = value;
            el.classList.add('auto-filled');
            addAutoBadge(el, badge);
        }
    }
}

// ============================================================
// AUTO-FILL FROM REGEX RESULT (alias)
// ============================================================
function autoFillFormFromRegex(result) {
    autoFillFormFromAnalysis(result);
}

function addAutoBadge(el, mode) {
    const label = el.parentElement?.querySelector('label');
    if (label && !label.querySelector('.auto-badge')) {
        const badgeText = mode || 'AUTO';
        label.innerHTML += ` <span class="auto-badge">${badgeText}</span>`;
    }
}

// ── AUTO-FILL RISKS FROM API DATA ──
function autoFillRisksFromAPI() {
    const gaspar = window._lastGaspar;
    if (gaspar?.data?.length) {
        const ppri = gaspar.data.filter(r => {
            const lib = (r.libelle_risque_jo || '').toLowerCase();
            return lib.includes('inondation') || lib.includes('submersion') || lib.includes('crue');
        });
        if (ppri.length) {
            const el = document.getElementById('plu_ppri');
            if (el && !el.value) {
                el.value = ppri.map(r => r.libelle_risque_jo || 'Inondation').join(', ');
                el.classList.add('auto-filled');
                addAutoBadge(el, 'API');
            }
        } else {
            const el = document.getElementById('plu_ppri');
            if (el && !el.value) {
                el.value = 'Aucun PPRi identifié (Géorisques)';
                el.classList.add('auto-filled');
                addAutoBadge(el, 'API');
            }
        }
    }

    const brgm = window._lastBrgm;
    if (brgm?.features?.length) {
        const props = brgm.features[0].properties;
        const niveau = props?.NIVEAU || props?.niveau || props?.ALEARG || '';
        if (niveau) {
            const el = document.getElementById('plu_secheresse');
            if (el && !el.value) {
                const niveauLabel = {'1':'Faible','2':'Moyen','3':'Fort','4':'Très fort'}[String(niveau)] || String(niveau);
                el.value = 'Aléa retrait-gonflement argiles : ' + niveauLabel;
                el.classList.add('auto-filled');
                addAutoBadge(el, 'API');
            }
        }
    } else {
        const el = document.getElementById('plu_secheresse');
        if (el && !el.value) {
            el.value = 'Aucun risque argiles identifié (BRGM)';
            el.classList.add('auto-filled');
            addAutoBadge(el, 'API');
        }
    }
}

// ── DISPLAY EXTRACTED TEXT ──
function displayExtractedText(fullText) {
    const panel = document.getElementById('extractedTextPanel');
    const body = document.getElementById('extractedTextBody');
    if (!panel || !body) return;
    const displayText = fullText.length > 50000 ? fullText.substring(0, 50000) + '\n\n[... texte tronqué ...]' : fullText;
    body.textContent = displayText;
    panel.classList.add('visible');
}

// ── SEARCH IN EXTRACTED TEXT ──
function searchExtractedText() {
    const query = document.getElementById('extractedTextSearch')?.value?.trim();
    const body = document.getElementById('extractedTextBody');
    if (!body) return;
    const fullText = (window._extractedTexts.reglement || '') + '\n' + (window._extractedTexts.lotissement || '');
    if (!query) { body.textContent = fullText.length > 50000 ? fullText.substring(0, 50000) : fullText; return; }
    try {
        const rx = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        const highlighted = escapeHtml(fullText).replace(rx, '<mark>$1</mark>');
        body.innerHTML = highlighted;
    } catch(e) { body.textContent = fullText; }
}

// ── TOGGLE EXTRACTED TEXT PANEL ──
function toggleExtractedText() {
    const body = document.getElementById('extractedTextBody');
    const searchBar = document.querySelector('.extracted-text-panel .search-bar');
    const toggle = document.getElementById('extractedTextToggle');
    if (!body) return;
    if (body.style.display === 'none') {
        body.style.display = '';
        if (searchBar) searchBar.style.display = '';
        if (toggle) toggle.innerHTML = '&#9660; Replier';
    } else {
        body.style.display = 'none';
        if (searchBar) searchBar.style.display = 'none';
        if (toggle) toggle.innerHTML = '&#9654; Déplier';
    }
}

function showInstallBanner() {
    if (document.getElementById('pwa-install-banner')) return;
    const banner = document.createElement('div');
    banner.id = 'pwa-install-banner';
    banner.style.cssText = `
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        color: white; padding: 14px 24px; border-radius: 14px;
        box-shadow: 0 8px 32px rgba(107,28,63,0.35); z-index: 10000;
        display: flex; align-items: center; gap: 14px; max-width: 420px;
        font-size: 14px; animation: slideUp 0.4s ease;
    `;
    banner.innerHTML = `
        <div style="font-size:28px">📲</div>
        <div style="flex:1">
            <div style="font-weight:700;margin-bottom:2px">Installer Mikit Terrains</div>
            <div style="opacity:0.85;font-size:12px">Accès rapide depuis votre écran d'accueil</div>
        </div>
        <button onclick="installPWA()" style="background:var(--accent);color:white;border:none;padding:8px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px">Installer</button>
        <button onclick="this.parentElement.remove()" style="background:none;border:none;color:rgba(255,255,255,0.7);font-size:20px;cursor:pointer;padding:0 4px">&times;</button>
    `;
    document.body.appendChild(banner);

    // Ajouter l'animation CSS
    if (!document.getElementById('pwa-install-style')) {
        const style = document.createElement('style');
        style.id = 'pwa-install-style';
        style.textContent = '@keyframes slideUp { from { transform: translateX(-50%) translateY(100px); opacity:0 } to { transform: translateX(-50%) translateY(0); opacity:1 } }';
        document.head.appendChild(style);
    }
}

function installPWA() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice => {
        if (choice.outcome === 'accepted') {
            console.log('PWA installée !');
        }
        deferredPrompt = null;
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.remove();
    });
}

</script>
</body>
</html>
